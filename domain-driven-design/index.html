<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用 Canvas 动画逐步拆解《领域驱动设计》：通用语言、分层架构、实体与值对象、聚合、突破、柔性设计、限界上下文与精炼。">
<title>领域驱动设计 · 动态解读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: drafting-table stage (canvas sheet + annotation rail) above a tape-transport bar */
:root{
  --paper:#F2F0EA; --sheet:#FBFAF6; --ink:#1A1F2E; --muted:#686D79; --line:#D9D6CC;
  --grid:rgba(36,99,235,.07); --grid2:rgba(36,99,235,.035);
  --red:#E5432A; --blue:#2463EB; --amber:#E39500; --teal:#0C9C7B; --violet:#7A48D8;
  --tar:#2B2622; --soft:#E9E6DD; --grain:.35; --acc:#0B7A64;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E121B; --sheet:#121826; --ink:#ECE8DE; --muted:#8E94A3; --line:#273042;
    --grid:rgba(120,160,255,.07); --grid2:rgba(120,160,255,.03);
    --red:#FF6448; --blue:#5B8CFF; --amber:#FFBE3B; --teal:#2DD4A7; --violet:#A884FF;
    --tar:#05070B; --soft:#1C2333; --grain:.18; --acc:#3DDBB0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E121B; --sheet:#121826; --ink:#ECE8DE; --muted:#8E94A3; --line:#273042;
  --grid:rgba(120,160,255,.07); --grid2:rgba(120,160,255,.03);
  --red:#FF6448; --blue:#5B8CFF; --amber:#FFBE3B; --teal:#2DD4A7; --violet:#A884FF;
  --tar:#05070B; --soft:#1C2333; --grain:.18; --acc:#3DDBB0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:20px 28px;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.seal{width:44px;height:44px;border-radius:4px;background:var(--acc);color:var(--sheet);display:grid;place-items:center;font:900 15px/1 var(--f-display);letter-spacing:.02em;flex:none}
.brand h1{font:900 26px/1.1 var(--f-display);margin:0;letter-spacing:.06em}
.brand p{margin:3px 0 0;font:500 10.5px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{font:500 13px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:8px 11px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button[aria-current="true"]{color:var(--sheet);background:var(--ink)}
.nav button:focus-visible,.btn:focus-visible,.track:focus-visible,.theme:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;font-size:15px;display:grid;place-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.sheet{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hint{position:absolute;left:12px;top:10px;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em;pointer-events:none}
.tip{position:absolute;pointer-events:none;max-width:290px;background:var(--ink);color:var(--sheet);padding:10px 13px 11px;border-radius:6px;font-size:13px;line-height:1.65;box-shadow:0 10px 30px -12px rgba(0,0,0,.45);z-index:3}
.tip b{display:block;font:600 14.5px/1.4 var(--f-display);margin-bottom:3px;color:var(--sheet)}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:2px}
.eyebrow{font:700 11px/1 var(--f-mono);color:var(--acc);letter-spacing:.14em;text-transform:uppercase}
.rail h2{font:900 27px/1.25 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.02em}
.steps{display:flex;gap:5px;align-items:center}
.steps i{width:18px;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ink)}
.steps span{font:500 11px var(--f-mono);color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.rail h3{font:700 17px/1.4 var(--f-body);margin:6px 0 0}
.rail p{margin:0;font-size:14.5px;line-height:1.85;color:var(--ink)}
.rail p b{color:var(--acc);font-weight:700}
blockquote{margin:4px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--acc);font:600 14.5px/1.7 var(--f-display);color:var(--ink)}
blockquote small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
[hidden]{display:none!important}
.ctrl{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;margin-top:4px}
.ctrl label{font:700 13px var(--f-body);display:flex;justify-content:space-between;align-items:baseline}
.ctrl output{font:700 20px var(--f-mono);color:var(--acc);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--acc)}
.ctrl .note{font-size:12.5px;line-height:1.6;color:var(--muted)}
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:6px}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .2s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.94)}
.btn.play{background:var(--ink);color:var(--sheet);border-color:var(--ink);width:46px;height:46px}
.btn svg{width:16px;height:16px;fill:currentColor}
.track{flex:1 1 280px;min-width:0;display:flex;gap:5px;height:30px;align-items:center;cursor:pointer}
.seg{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;min-width:8px}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
.seg.past i{background:var(--ink)}
.count{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.keys{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.04em}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}.sheet{aspect-ratio:4/3}.nav{margin-left:0;width:100%}}
@media (max-width:560px){.sheet{aspect-ratio:4/5}.brand h1{font-size:22px}.rail h2{font-size:23px}.keys{display:none}.nav button{padding:7px 9px;font-size:12.5px}}
.ctrl .lbl{font:700 13px var(--f-body)}
.segbtns{display:flex;flex-wrap:wrap;gap:6px}
.segbtns button{flex:1 1 auto;font:600 12.5px/1.25 var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer;transition:background .2s,color .2s}
.segbtns button:hover{background:var(--soft)}
.segbtns button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.segbtns button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bgcard{position:absolute;inset:0;z-index:3;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(3px);display:flex;padding:28px 34px}
.bgin{margin:auto;max-width:640px;width:100%;animation:bgup .5s ease-out}
@keyframes bgup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bgtag{display:inline-block;font:700 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--sheet);background:var(--acc);padding:6px 9px;border-radius:3px}
.bgcard h4{font:900 26px/1.3 var(--f-display);margin:12px 0 10px;color:var(--ink)}
.bgcard p{margin:0 0 14px;font-size:14.5px;line-height:1.85;color:var(--ink)}
.bgcard b{color:var(--acc)}
.bgcard dl{display:grid;grid-template-columns:max-content 1fr;gap:9px 16px;margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.bgcard dt{font:700 13.5px/1.6 var(--f-body);color:var(--acc)}
.bgcard dd{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink)}
.bgask{font:600 14.5px/1.7 var(--f-display);border-left:2px solid var(--amber);padding-left:12px;color:var(--ink)}
.bgnext{margin-top:14px;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
@media (max-width:560px){.bgcard{padding:18px 16px}.bgcard h4{font-size:21px}.bgcard dl{grid-template-columns:1fr;gap:2px}.bgcard dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="seal">领域</div>
      <div><h1>领域驱动设计</h1><p>Domain-Driven Design · Eric Evans · 软件核心复杂性应对之道</p></div>
    </div>
    <nav class="nav" id="nav" aria-label="章节"></nav>
    <button class="theme" id="theme" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
  </header>

  <main class="stage">
    <div class="sheet" id="sheet">
      <canvas id="cv" aria-label="动态示意图"></canvas>
      <div class="hint">HOVER · 悬停图形查看详解</div>
      <div class="tip" id="tip" hidden></div>
      <div class="bgcard" id="bgcard" hidden></div>
    </div>
    <aside class="rail" aria-live="polite">
      <div class="eyebrow" id="chap"></div>
      <h2 id="stitle"></h2>
      <div class="steps" id="steps"></div>
      <h3 id="caph"></h3>
      <p id="cap"></p>
      <blockquote id="quote" hidden></blockquote>
      <div class="ctrl" id="ctrl" hidden></div>
    </aside>
  </main>

  <footer class="transport">
    <div class="btns">
      <button class="btn" id="prev" aria-label="上一步"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="btn play" id="play" aria-label="暂停"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button class="btn" id="next" aria-label="下一步"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="播放进度"></div>
    <div class="count" id="count">01 / 01</div>
    <div class="keys">← → 切换 · 空格 播放/暂停</div>
  </footer>
</div>


<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const E={
  io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  out:t=>1-Math.pow(1-t,3),
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  expo:t=>t>=1?1:1-Math.pow(2,-10*t)
};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv=$('#cv'),ctx=cv.getContext('2d'),sheet=$('#sheet'),tip=$('#tip');
let W=0,H=0,DPR=1;
function resize(){const r=sheet.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
new ResizeObserver(resize).observe(sheet);resize();

/* ---------- theme ---------- */
let C={};
const KEYS=['paper','sheet','ink','muted','line','red','blue','amber','teal','violet','tar','soft','acc'];
function readColors(){const cs=getComputedStyle(document.documentElement);KEYS.forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
function rgba(hex,a){hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
$('#theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};

/* ---------- drawing helpers ---------- */
const FD='"Noto Serif SC","Songti SC",serif',FB='"Noto Sans SC","PingFang SC",system-ui,sans-serif',FM='"JetBrains Mono",ui-monospace,Menlo,monospace';
const font=(size,w=500,f='b')=>`${w} ${size}px ${f==='d'?FD:f==='m'?FM:FB}`;
function txt(s,x,y,o={}){ctx.save();ctx.font=font(o.size||13,o.w||500,o.f);ctx.fillStyle=o.color||C.ink;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';if(o.a!=null)ctx.globalAlpha*=o.a;ctx.fillText(s,x,y);ctx.restore()}
function tw(s,size,w=500,f){ctx.save();ctx.font=font(size,w,f);const m=ctx.measureText(s).width;ctx.restore();return m}
function dot(x,y,r,fill,stroke,lw=1.5){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function seg(x1,y1,x2,y2,color,lw=1,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
function arrow(x1,y1,x2,y2,color,lw=1.5,head=8){seg(x1,y1,x2,y2,color,lw);const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function pill(s,x,y,o={}){const size=o.size||12,pad=o.pad||9,w=tw(s,size,o.w||600,o.f)+pad*2,h=size+pad*1.1;const x0=o.align==='left'?x:o.align==='right'?x-w:x-w/2;rr(x0,y-h/2,w,h,h/2);ctx.fillStyle=o.bg||C.ink;ctx.fill();if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=1;ctx.stroke()}txt(s,x0+w/2,y+.5,{size,w:o.w||600,color:o.color||C.sheet,f:o.f});return {x:x0,y:y-h/2,w,h}}
function layer(a,fn){if(a<=.004)return;ctx.save();ctx.globalAlpha*=Math.min(1,a);fn();ctx.restore()}
function glow(x,y,r,color,a){if(r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
const along=(x1,y1,x2,y2,p)=>[lerp(x1,x2,p),lerp(y1,y2,p)];

/* ---------- hotspots ---------- */
let HOT=[];
const live=()=>ctx.globalAlpha>.45;
function hotC(x,y,r,t,b,click){if(live())HOT.push({k:'c',x,y,r,t,b,click})}
function hotR(x,y,w,h,t,b,click){if(live())HOT.push({k:'r',x,y,w,h,t,b,click})}
function hotF(fn,t,b){if(live())HOT.push({k:'f',fn,t,b})}
function hit(mx,my){for(let i=HOT.length-1;i>=0;i--){const h=HOT[i];if(h.k==='c'&&Math.hypot(mx-h.x,my-h.y)<=h.r)return h;if(h.k==='r'&&mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h)return h;if(h.k==='f'&&h.fn(mx,my))return h}return null}


/* ---------- DDD-specific helpers ---------- */
function box(x,y,w,h,o={}){rr(x,y,w,h,o.r==null?6:o.r);if(o.fill){ctx.fillStyle=o.fill;ctx.fill()}if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||1.2;if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();if(o.dash)ctx.setLineDash([])}}
function curve(x1,y1,qx,qy,x2,y2,color,lw=1.4,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(qx,qy,x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
function curveArrow(x1,y1,qx,qy,x2,y2,color,lw=1.4,head=7){curve(x1,y1,qx,qy,x2,y2,color,lw);const a=Math.atan2(y2-qy,x2-qx);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
const qpt=(x1,y1,qx,qy,x2,y2,p)=>{const u=1-p;return [u*u*x1+2*u*p*qx+p*p*x2,u*u*y1+2*u*p*qy+p*p*y2]};
function poly(pts,p){let L=0;const d=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(l);L+=l}let r=clamp(p)*L;for(let i=0;i<d.length;i++){if(r<=d[i]||i===d.length-1){const f=d[i]?clamp(r/d[i]):0;return along(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],f)}r-=d[i]}return pts[0]}
function polyline(pts,color,lw=1.4,dash){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
const solo=(s,k)=>(k?s.v(k):1)*(1-s.v(k+1));
const mkClock=()=>{let key=null,t0=0;return (s,x='')=>{const k=s.step+'|'+x;if(k!==key){key=k;t0=s.t}return REDUCED?99:s.t-t0}};
// rich text: CJK wraps per char, latin words and highlighted terms stay whole
const LC=new Map();
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>LC.clear());
const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function toks(s,terms){const out=[];const plain=p=>(p.match(/[A-Za-z0-9_.()<>!=$,#]+|\s|./gu)||[]).forEach(c=>out.push({s:c}));
 if(terms&&terms.length){const re=new RegExp('('+terms.map(esc).join('|')+')');s.split(re).forEach((p,i)=>{if(!p)return;if(i%2)out.push({s:p,hl:true});else plain(p)})}else plain(s);return out}
function layout(s,maxW,size,w,f,terms){const key=[s,maxW|0,size,w,f,terms&&terms.join('|')].join('§');let L=LC.get(key);if(L)return L;
 L=[];let line=[],lw=0;

{nav:'分层架构',chap:'第 4 章 · 分离领域',title:'把领域层隔离出来',

 {h:'一个下拉框背后的五件事',dur:8,c:'运输系统里“从城市列表选目的地”这个简单操作，代码要做五件事：画控件、查数据库取城市、校验输入、<b>把城市和货物关联</b>、提交数据库。它们写在同一个程序里，只有一件和运输业务相关。',q:'上面所有的代码都在同一个程序中，但是只有一小部分代码与运输业务相关。（第 4 章）'},

 {bg:1,h:"背景：网上银行转账",dur:15,c:"用户在网上银行把钱从自己的一个账户转到另一个账户。看起来简单，其实要同时做好几件事：显示表单、检查输入、真正改变两个账户的余额、保证不会只做一半，最后记账并通知用户。",terms:[["借记 / 贷记","从转出账户扣钱叫借记（debit），给转入账户加钱叫贷记（credit）。"],["借贷相等","一次转账扣掉的金额必须等于加上的金额，钱不能凭空多出来或消失。这是银行的业务规则。"],["事务","一组操作要么全部成功，要么全部撤销。不能出现钱扣了却没加上的情况。"]],ask:"看每件事落在哪一层：哪些是业务规则，哪些只是技术支持？"},

{nav:'构造块',chap:'第 5 章 · 软件中所表示的模型',title:'ENTITY、VALUE、SERVICE、MODULE',
ctrlSteps:[2],ctrl:`<div class="lbl">同一个“地址”，在三种业务里</div><div class="segbtns" id="adb"><button data-k="mail">邮购公司</button><button data-k="post">邮政服务</button><button data-k="power">电力公司</button></div><div class="note">地址是 ENTITY 还是 VALUE，取决于业务怎样使用它。</div>`,
enter(){segCtl('#adb',()=>addrMode,k=>addrMode=k)},
steps:[
 {h:'ENTITY：一条标识线',dur:8.5,c:'有些对象首先由<b>标识</b>定义，而不是由属性定义。一个客户十几年里改了名字、搬了家、换了工作，系统里他仍然是同一个人。这条贯穿整个生命周期的线就是 <b>ENTITY</b> 的标识。',q:'一些对象主要不是由它们的属性定义的。它们实际上表示了一条“标识线”（A Thread of Identity），这条线跨越时间，而且常常经历多种不同的表示。（第 5 章）'},
 {h:'VALUE OBJECT：只关心是什么',dur:8,c:'另一些对象没有身份：两枚一元硬币可以随意交换，没人在乎是哪一枚。这样的对象是 <b>VALUE OBJECT</b>，应当设计成<b>不可变</b>的；需要改变时整体替换，而不是修改。',q:'当我们只关心一个模型元素的属性时，应把它归类为VALUE OBJECT……我们只关心它们是什么，而不关心它们是谁。（第 5 章）'},
 {bg:1,h:"背景：三家公司怎样用“地址”",dur:15,c:"同一个“某某路 12 号”，在三家公司的软件里作用完全不同。它该建模成 ENTITY 还是 VALUE OBJECT，要看业务<b>是否需要追踪“这一个”地址</b>。",terms:[["邮购公司","地址只用来核对信用卡、寄送包裹。两个室友从同一个地址分别下单，系统不需要知道这是同一个地方。"],["邮政服务","要把地址组织成层级：地区 → 城市 → 邮区 → 街区 → 具体地址，用来安排投递路线、调整邮区划分。每个地址都要能单独识别。"],["电力公司","地址对应电线接入的那处住所。两个室友分别打电话开通服务时，公司必须认出他们住在同一处。"]],ask:"在右侧切换三种业务，看同一个地址在模型里是“可以互换的值”，还是“有身份的对象”。"},
 {h:'地址：取决于上下文',dur:10,c:'同一个“地址”可以是 VALUE，也可以是 ENTITY。用右侧按钮切换三种业务：<b>邮购</b>只拿它来寄货；<b>邮政</b>要把地址组织成层级、重划邮区；<b>电力</b>要知道两个打电话的人是不是住在同一处。'},
 {h:'SERVICE：不属于任何对象的操作',dur:8,c:'转账要动两个账户，还要遵守全局规则。把它硬塞给 Account 很别扭，于是建模为一个 <b>SERVICE</b>：名字取自通用语言里的动词，接口无状态，参数和结果都是领域对象。',q:'资金转账服务……涉及两个账户和一些全局规则。（第 5 章）'},
 {h:'MODULE：按概念划分',dur:8.5,c:'<b>MODULE</b> 把高内聚的概念放在一起。常见错误是按技术分包（entities、services、daos），这样一个概念被拆散到各处。按领域概念分组，代码结构读起来就和模型一致。',q:'MODULE并不仅仅是代码的划分，而且也是概念的划分。（第 5 章）'}
],
draw(s){

 const a0=solo(s,0),a1=solo(s,1),a2=solo(s,2),a3=solo(s,3),a4=s.v(4);
 // ENTITY timeline
 layer(a0,()=>{
  const snaps=[['2009','王小明','北京','学生'],['2014','王小明','上海','工程师'],['2019','王晓明','上海','经理'],['2024','王晓明','深圳','顾问']];

   [['对号入座 → 座位是 ENTITY',W*(n?.27:.32),C.acc,'每张票对应一个具体座位，座位号就是标识。'],['自由入座 → 座位不必是 ENTITY',W*(n?.73:.68),C.muted,'只需要统计售出多少张票，座位之间没有区别。']].forEach(([l,x,c,b])=>{
    for(let k=0;k<5;k++)box(x-50+k*21,sy-8,16,14,{fill:rgba(c,.25+(k===2&&c===C.acc?.6:0)),r:3});
    txt(l,x,sy+20,{size:n?9.5:11,color:c,w:600});hotR(x-70,sy-12,140,40,l,b)});
  });
 });
 // VALUE coins
 layer(a1,()=>{
  const cx=W/2,cy=H*(n?.33:.36),N=5,gap=n?54:76;
  const ph=(t*.35)%1,sw=Math.floor(t*.35)%N;
  for(let i=0;i<N;i++){
   let x=cx+(i-(N-1)/2)*gap,y=cy;
   const j=(sw+1)%N;
   if(i===sw||i===j){const e=E.io(clamp(ph*2)),d=(j-sw)*gap*(i===sw?1:-1);x+=d*e;y+=Math.sin(e*Math.PI)*(i===sw?-28:28)}
   glow(x,y,30,C.amber,.25);dot(x,y,n?19:24,C.amber);dot(x,y,n?15:19,null,rgba(C.sheet,.7),1.2);
   txt('¥1',x,y,{size:n?12:14,w:700,color:C.sheet,f:'m'});
   hotC(x,y,24,'硬币','两枚一元硬币可以随意交换。我们只关心面值，不关心是哪一枚。');
  }
  txt('可以互换 → 没有标识',cx,cy+(n?50:62),{size:n?11:12.5,w:600,color:C.muted});
  // immutable color
  const y2=H*(n?.66:.68),bw=n?96:130;
  const c1=['Color(255, 0, 0)',C.red],c2=['Color(0, 0, 255)',C.blue];
  const xs=[W/2-(n?120:200),W/2,W/2+(n?120:200)];
  box(xs[0]-bw/2,y2-20,bw,40,{fill:rgba(C.red,.15),stroke:C.red});txt(c1[0],xs[0],y2,{size:n?9:11,f:'m'});
  arrow(xs[0]+bw/2+4,y2,xs[1]-bw/2-6,y2,C.muted,1.3);
  txt('mixedWith(blue)',(xs[0]+xs[1])/2,y2-14,{size:n?8.5:10,f:'m',color:C.muted});
  const p=E.out(clamp((t%5)/1.5));
  layer(p,()=>{box(xs[1]-bw/2,y2-20,bw,40,{fill:rgba(C.violet,.18),stroke:C.violet});txt('Color(128,0,128)',xs[1],y2,{size:n?9:11,f:'m'})});
  hotR(xs[0]-bw/2,y2-20,bw,40,'原值不变','VALUE OBJECT 不可变：混色不会改动原来的红色，而是返回一个新的颜色对象。');
  hotR(xs[1]-bw/2,y2-20,bw,40,'新值','操作的结果是另一个 VALUE。不可变的值可以被放心地共享、复制。');
  layer(p,()=>{txt('原对象没有被修改，得到的是一个新的值',W/2,y2+(n?40:44),{size:n?10.5:12,color:C.acc,w:600})});
 });
 // address

  const k=addrMode,ck=E.out(clamp(s.age*1.5));

   arrow(cx-(n?80:150)+a.w/2+4,cy,cx+(n?80:150)-b.w/2-6,cy,C.muted,1.3);

   const v=val(cx,hy+(n?70:80),'地址 Address','VALUE','住处 ENTITY 的地址属性可以仍然是 VALUE。');
   seg(cx,hy+h.h/2+12,cx,hy+(n?70:80)-v.h/2,C.muted,1.2,[3,3]);
   [[-1,'室友甲'],[1,'室友乙']].forEach(([sg,l],i)=>{const x=cx+sg*(n?110:200),y=hy-(n?70:80);person(x,y,n?9:11,C.blue);txt(l,x,y+(n?26:30),{size:n?10:11.5});

  const cx=W/2,cy=H*.36,dx=n?W*.32:W*.3;

  curveArrow(cx-dx+20,cy+12,cx-dx*.5,sy,cx-S.w/2-4,sy,rgba(C.violet,.6),1.3);curveArrow(cx+S.w/2+4,sy,cx+dx*.5,sy,cx+dx-20,cy+12,rgba(C.violet,.6),1.3);
  const p=(t*.35)%1,[mx,my]=p<.5?qpt(cx-dx+20,cy+12,cx-dx*.5,sy,cx-S.w/2,sy,p*2):qpt(cx+S.w/2,sy,cx+dx*.5,sy,cx+dx-20,cy+12,(p-.5)*2);
  glow(mx,my,16,C.amber,.6);dot(mx,my,4,C.amber);
  txt('全局规则：借贷相等、限额、审计…',cx,sy+(n?30:34),{size:n?10:11.5,color:C.muted});
  const cw=n?W-30:Math.min(520,W*.62);
  code(['// 名字来自通用语言，接口无状态','FundsTransferService.transfer(','    Account from, Account to, Money amount)'],cx-cw/2,H*(n?.68:.66),cw,{size:n?9.5:11.5,hl:[1]});
 });
 // MODULE morph
 layer(a4,()=>{
  const items=[['Customer',0,0],['Contact',2,0],['CustomerRepository',3,0],['Cargo',0,1],['HandlingEvent',0,1],['CargoFactory',1,1],['Itinerary',0,2],['Leg',1,2],['RoutingService',1,2],['Invoice',0,3],['BillingService',1,3]];

   layer(1-pm,()=>txt(tech[g]+'/',x+10,y+14,{size:n?10:11,f:'m',color:C.muted,align:'left'}));
   layer(pm,()=>txt(con[g]+'/',x+10,y+14,{size:n?10:11,f:'m',w:700,color:C.acc,align:'left'}));
  }
  const cnt=[0,0,0,0],cnt2=[0,0,0,0];
  items.forEach((it,i)=>{
   const k=kind(i),c=it[2],ia=cnt[k]++,ib=cnt2[c]++;
   const ax=gx(k)+gw/2,ay=gy(k)+34+ia*(n?22:28),bx=gx(c)+gw/2,by=gy(c)+34+ib*(n?22:28);
   const x=lerp(ax,bx,pm),y=lerp(ay,by,pm)-Math.sin(pm*Math.PI)*20;
   const col=[C.blue,C.amber,C.violet,C.acc][c];
   const b=pill(it[0],x,y,{size:n?8.5:10.5,f:'m',bg:C.sheet,color:col,stroke:col,pad:n?5:7});
   hotR(b.x,b.y,b.w,b.h,it[0],'颜色表示它属于哪个领域概念。按技术分包时，同一种颜色散落在各个包里；按概念分包后，它们聚到一起。');
  });
  txt(pm<.5?'按技术分包：同一个概念被拆散':'按领域概念分包：高内聚、低耦合',W/2,H-(n?18:26),{size:n?11:13,w:700,color:pm<.5?C.red:C.acc,f:'d'});
 });

 {h:'对象之间的关联太多',dur:8,c:'模型里对象之间的关联密密麻麻，删除一个人要不要删掉他的地址？修改一辆车时哪些对象必须一起保持一致？没有边界，就没法回答。<b>AGGREGATE</b> 就是一组被当作整体对待的对象，用来回答这些问题。'},
 {bg:1,h:"背景：汽车和它的轮胎",dur:15,c:"设想一家汽车修理厂的系统，要记录每辆车的保养情况，包括轮胎的换位和磨损。车有全球唯一的车架号（VIN）；轮胎只在这辆车上被叫作“左前轮”“右后轮”，离开这辆车，没人关心它是哪一只。",terms:[["VIN 车架号","每辆车全球唯一的编号，在任何地方都能用它找到这辆车。"],["轮胎","标识只在“这辆车”内部有意义：左前、右后。"],["要回答的问题","外部系统能不能绕过汽车直接改一只轮胎？删掉一辆车时，它的轮胎怎么处理？"]],ask:"看哪个对象是对外的入口，边界画在哪里。"},
 {h:'根与边界',dur:8.5,c:'汽车是 AGGREGATE 的<b>根</b>，有全局标识 VIN；轮胎在边界内，只有局部标识（“左前轮”）。外部对象只能引用根，不能直接抓住内部的轮胎；删除操作必须一次删掉边界内的所有东西。',q:'在每个事务完成时，AGGREGATE内部所应用的固定规则必须得到满足。（第 6 章）'},
 {bg:1,h:"背景：采购单和它的限额",dur:15,c:"员工通过系统提交<b>采购单（Purchase Order）</b>。一张单子有多个<b>条目（Line Item）</b>，每条写着买什么商品、买几件、单价多少。每张采购单有一个审批过的<b>限额</b>，所有条目加起来不能超过它。系统允许多个人同时编辑同一张采购单。",terms:[["Part 商品","商品目录里的一项，比如吉他、长号，带有当前价格。"],["固定规则（invariant）","任何时候都必须成立的业务规则。这里是：条目总额 ≤ 限额。"],["数据库锁","改数据前先把它“锁住”，别人要等你改完才能改，避免同时修改互相覆盖。锁住多大范围，是这个例子的关键。"]],ask:"两个人的修改各自都没超限，合起来却超了。应该锁住什么，才能守住这条规则？"},
 {h:'例：采购单限额',dur:11,c:'采购单 #0012946 的规则是“所有条目总额不超过限额 $1,000”。George 加了 2 把吉他（总额 900），Amanda 同时加了 1 支长号（总额也是 900）。两个人各自都合规，合起来却是 <b>1,100</b>。用右侧按钮对比两种锁定方式。',q:'显然，锁定单个行并不是一种充分的保护机制。（第 6 章）'},
 {h:'边界不要画得太大',dur:9,c:'能不能把 Part（商品目录）也锁进来？这样一个人改价格，所有引用该商品的采购单都被锁住。书中的做法是：把价格<b>复制</b>到 Line Item 中。采购单只依赖自己内部的数据，边界就清晰了。',q:'过于谨慎的锁定会妨碍人们的工作。（第 6 章）'},
 {h:'FACTORY 与 REPOSITORY',dur:9,c:'AGGREGATE 的生命周期由两个模式管理：<b>FACTORY</b> 负责把它作为整体创建出来，并保证固定规则成立；<b>REPOSITORY</b> 负责保存和取回，像一个内存中的集合，只为 AGGREGATE 根提供。',q:'在创建AGGREGATE时要把它作为一个整体，并确保它满足固定规则。（第 6 章）'}
],
draw(s){
 const {W,H,t}=s,n=s.narrow;
 const a0=solo(s,0),a1=solo(s,1),a2=solo(s,2),a3=solo(s,3),a4=s.v(4);
 // tangled graph
 layer(a0,()=>{
  const N=14,cx=W/2,cy=H*.46,R=Math.min(W,H)*.32;
  const P=[];for(let i=0;i<N;i++){const a=i/N*TAU+rnd(i)*.4;P.push([cx+Math.cos(a)*R*(.55+rnd(i+5)*.5)+Math.sin(t*.6+i)*4,cy+Math.sin(a)*R*(.55+rnd(i+9)*.5)*(n?1.1:.85)+Math.cos(t*.5+i)*4])}
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(rnd(i*31+j)<.27)seg(P[i][0],P[i][1],P[j][0],P[j][1],rgba(C.ink,.18),1);
  P.forEach((p,i)=>{dot(p[0],p[1],7,C.sheet,C.muted,1.5);hotC(p[0],p[1],10,'没有边界的对象','它和多个对象相关联。修改它时，哪些对象必须一起改变？删除它时，哪些对象也应该删除？')});
  const pr=(t*.3)%1,i0=Math.floor(t*.3)%N;dot(P[i0][0],P[i0][1],9,null,C.red,2);
  txt('删除一个对象时，要不要删掉和它相关的对象？',W/2,H*(n?.88:.9),{size:n?11:13,w:600,color:C.red});
 });
 // car aggregate
 layer(a1,()=>{
  const cx=W/2,cy=H*.44,bw=Math.min(W*.7,520),bh=H*.48;
  box(cx-bw/2,cy-bh/2,bw,bh,{fill:rgba(C.acc,.06),stroke:C.acc,lw:1.6,dash:[7,5],r:16});

  const car=pill('Car · VIN 1HGCM82633',cx,cy-bh*.18,{size:n?11:13,f:'m',bg:C.acc});
  hotR(car.x,car.y,car.w,car.h,'AGGREGATE 根','根是一个 ENTITY，具有全局标识。它负责检查边界内的固定规则。外部对象只能持有对根的引用。');
  const ty=cy+bh*.2,pos=['左前','右前','左后','右后'];
  pos.forEach((p,i)=>{const x=cx+(i-1.5)*(bw/4.6);dot(x,ty,n?15:19,C.ink);dot(x,ty,n?7:9,C.sheet);txt(p,x,ty+(n?26:32),{size:n?9.5:11,color:C.muted});
   seg(cx,car.y+car.h,x,ty-(n?15:19),rgba(C.acc,.5),1.2);hotC(x,ty,20,'轮胎 · 局部标识','“'+p+'轮”只在这辆车里有意义。外部不能直接引用轮胎，只能通过 Car 访问。')});
  const ox=n?cx:cx+bw/2+(W-cx-bw/2)/2,oy=n?cy+bh/2+36:cy-bh*.18;
  const o=pill('外部对象',ox,oy,{size:n?10:11.5,bg:C.sheet,color:C.ink,stroke:C.line});
  if(!n){arrow(o.x-4,oy,car.x+car.w+6,oy,C.acc,1.4);
   const tx=cx+1.5*(bw/4.6);seg(o.x+10,oy+12,tx+22,ty-10,C.red,1.4,[4,4]);txt('✗',(o.x+tx)/2+20,(oy+ty)/2,{size:16,w:700,color:C.red})}
  hotR(o.x,o.y,o.w,o.h,'从外部只能引用根','直接持有内部对象的引用会绕过根的检查，固定规则就无法保证。');
 });
 // PO concurrency

  const el=REDUCED?99:(performance.now()-lockT0)/1000,ck=Math.max(el,s.age);

  const po=lockMode==='po';
  const bw=Math.min(n?W-24:W*.52,460),bx=n?12:W*.06,by=H*(n?.06:.1);

  const draw=(r,i,a,col,who)=>layer(a,()=>{const y=by+38+rowH*(i+1);if(col){box(bx+4,y-rowH/2+1,bw-8,rowH-2,{fill:rgba(col,.14),r:3})}
   r.forEach((c,k)=>txt(k?c:c,bx+bw*cx[k],y,{size:n?10:11.5,f:'m',align:'left',w:col?700:500}));
   if(who)txt(who,bx+bw-6,y,{size:n?8.5:9.5,color:col,align:'right'});
   if(!po&&col)lockIcon(bx+bw*.02+2,y,9,col)});
  draw(base[0],0,1,null);draw(base[1],1,1,null);
  draw(['Guitars','2','100','200'],2,gA,C.blue,'George');

  const ty=by+38+rowH*5+2;seg(bx+8,ty-rowH/2,bx+bw-8,ty-rowH/2,C.line,1);
  const over=tot>1000;
  txt('Total',bx+bw*.06,ty,{size:n?11:12,f:'m',w:700,align:'left'});
  txt('$'+Math.round(tot).toLocaleString('en-US'),bx+bw*.84,ty,{size:n?11.5:13,f:'m',w:700,align:'left',color:over?C.red:C.ink});
  hotR(bx,by,bw,rowH*5+46,'采购单是 AGGREGATE 根','固定规则“总额 ≤ 限额”涉及所有 Line Item，所以采购单和它的条目是一个整体。');
  // people
  const px=n?W*.25:bx+bw+W*.1,py=n?by+rowH*5+100:by+40,qx=n?W*.75:px,qy=n?py:by+rowH*5+10;
  person(px,py,n?9:11,C.blue);txt('George',px,py+(n?24:28),{size:n?10:11.5,w:700});
  person(qx,qy,n?9:11,C.amber);txt('Amanda',qx,qy+(n?24:28),{size:n?10:11.5,w:700});
  hotC(px,py,24,'George','在采购单里增加 2 把吉他。单看他的修改，总额 900，合规。');
  hotC(qx,qy,24,'Amanda',po?'采购单整体被 George 锁住，她必须等待。提交时会发现总额已是 900，她可以提高限额或减少一把吉他。':'同时增加 1 支长号。单看她的修改，总额也是 900，合规。');
  if(po){layer(aA,()=>{const b=pill('等待：采购单已被锁定',qx+(n?0:70),qy+(n?44:0),{size:n?9.5:10.5,bg:C.amber,align:n?undefined:'left'});})}
  layer(fin,()=>{
   const my=n?H*.9:H*.84,mx=n?W/2:W*.6;
   if(!po){pill('✗  $1,100 超出限额：两个合规的修改破坏了固定规则',mx,my,{size:n?10:12,bg:C.red,f:'d'})}
   else{pill('✓  一次只有一人修改，固定规则得到保护',mx,my,{size:n?10:12,bg:C.acc,f:'d'})}
  });
 });
 // Part price copy

   txt(l,lx-pw/2+10,y-9,{size:n?9.5:10.5,f:'m',w:700,align:'left'});
   txt(copied>.5?'Guitar · price: $100（已复制）':'Guitar → Part',lx-pw/2+10,y+10,{size:n?9:10.5,f:'m',align:'left',color:copied>.5?C.acc:C.muted});
   layer(1-copied,()=>{seg(lx+pw/2,y,rx-pw/2,cy,rgba(C.red,.6),1.3);lockIcon(lx+pw/2+18,y-(y-cy)*.12,10,C.red)});
   hotR(lx-pw/2,y-24,pw,48,l,copied>.5?'下单时把价格复制进 Line Item。之后商品目录改价，不影响已有采购单，采购单也不用锁 Part。':'如果把 Part 放进采购单的边界，改价格就要锁住所有引用它的采购单。');
  });

  layer(copied,()=>txt('把价格复制进 Line Item → 边界清晰',W/2,H*.82,{size:n?11:13,w:700,color:C.acc,f:'d'}));
 });
 // lifecycle
 layer(a4,()=>{
  const y=H*.42,xs=n?[W*.17,W*.5,W*.83]:[W*.2,W*.5,W*.8];
  const F=pill('FACTORY',xs[0],y,{size:n?11:14,f:'m',bg:C.violet}),A=pill('AGGREGATE',xs[1],y,{size:n?11:14,f:'m',bg:C.acc}),R=pill('REPOSITORY',xs[2],y,{size:n?11:14,f:'m',bg:C.blue});

  arrow(F.x+F.w+4,y,A.x-6,y,C.muted,1.3);

  curveArrow(R.x+R.w*.2,R.y+R.h+4,(xs[1]+xs[2])/2,y+H*.12,A.x+A.w*.8,A.y+A.h+4,rgba(C.blue,.7),1.3);
  txt('保存',(xs[1]+xs[2])/2,y-H*.12+(n?10:4),{size:n?9.5:11,color:C.blue});txt('重建',(xs[1]+xs[2])/2,y+H*.12-(n?10:4),{size:n?9.5:11,color:C.blue});
  txt('创建',(xs[0]+xs[1])/2,y-16,{size:n?9.5:11,color:C.violet});

 });

 {bg:1,h:"背景：什么是银团贷款",dur:15,c:"Evans 的团队为一家投资银行开发管理<b>银团贷款</b>的系统。一家大企业要借很多钱，任何一家银行单独放贷风险都太大，于是几家银行组成<b>银团（syndicate）</b>，按比例出资，也按比例分享利息和费用。",terms:[["Facility 信贷额度","银团承诺借给企业的总额度，比如 1 亿美元。有点像信用卡额度：承诺了，但不一定马上用完。"],["Loan 提款","企业在额度内实际借走的一笔钱，可以分多次提。"],["Share 份额","每家银行在一笔钱里占多少。收到的本金、利息、费用都要按份额分给各家银行。"]],ask:"注意 Facility 的份额和每笔 Loan 的份额：它们一定相同吗？"},
 {h:'银团贷款',dur:9,c:'几家银行组成银团，为一家企业提供 1 亿美元的<b>信贷额度（Facility）</b>：A 出 50%、B 出 30%、C 出 20%。企业按需<b>提款（Loan）</b>，每次提款的份额一开始都按 Facility 的比例分摊。'},
 {h:'份额不再成比例',dur:11,c:'第一次提款 5000 万，按比例分。第二次提款 3000 万时，<b>B 决定不参与</b>，由 A 承担。于是 Loan 的份额变成 A 4900 万、B 1500 万、C 1600 万，和 Facility 的 50/30/20 <b>不再成比例</b>。旧模型把 Loan 的份额强行绑在 Facility 上，处处出错。',q:'公司B决定不参与Loan，而由公司A来承担这部分额外的股份……Loan的股份份额就不再与Facility的股份成比例了。（第 8 章）'},

 // Facility bar

{nav:'柔性设计',chap:'第 9–10 章 · 显式概念与柔性设计',title:'让设计易于理解、易于修改',
ctrlSteps:[1],ctrl:`<div class="lbl">SPECIFICATION：拖欠发票筛选</div><div class="segbtns" id="spb"><button data-k="on">应用规格</button><button data-k="off">不应用</button></div><div class="note">规格是一个谓词：isSatisfiedBy(invoice)。</div>`,
enter(){segCtl('#spb',()=>specOn?'on':'off',k=>specOn=k==='on')},
steps:[
 {h:'隐式概念要显式化',dur:8,c:'业务规则常常散落在 if 语句里。第 9 章说：听专家的话，留意那些反复出现、却在模型里找不到的词；把<b>约束、过程、规则</b>提炼成显式的对象。'},
 {bg:1,h:"背景：拖欠发票",dur:15,c:"公司给客户开<b>发票（Invoice）</b>，上面写着金额和到期日。客户过了期限还没付清，财务就要把这张发票标为<b>拖欠</b>，进行催收，甚至停止给这个客户赊账。",terms:[["到期日","发票要求付款的最后一天。"],["宽限期","到期后再给的几天缓冲，不同客户可能不一样。"],["拖欠规则","“过了到期日加宽限期，仍未付清”。系统里很多地方都要用这条规则：检查一张发票、找出所有拖欠的发票、生成催收清单。"]],ask:"这条规则原来散落在各处的 if 语句里。把它做成一个独立的对象之后，会怎样？"},
 {h:'SPECIFICATION',dur:9.5,c:'“发票拖欠”是一条规则：到期超过宽限期仍未付清。把它做成 <b>SPECIFICATION</b> 对象，同一条规则可以用于三件事：<b>验证</b>一个对象、从集合中<b>选择</b>对象、按要求<b>创建</b>新对象。',q:'SPECIFICATION就是一个谓词，可用来确定对象是否满足某些标准。（第 9 章）'},
 {bg:1,h:"背景：油漆店的调色程序",dur:15,c:"这是一个给油漆店用的程序。顾客想要某种颜色，店员把几种颜料按比例倒进同一个桶里混合。程序要算出<b>混合后的颜色和体积</b>，告诉店员怎么调。",terms:[["Paint 一桶漆","有体积（volume），还有红、黄、蓝三种颜料的含量，合起来决定颜色。"],["mixIn(另一桶漆)","把另一桶漆倒进这一桶：体积相加，颜色按比例混合。"],["发现的问题","现实中倒完以后另一桶应该空了，但代码执行后另一桶的体积没变。这是故意的还是 bug？只看方法名看不出来。"]],ask:"一个方法既修改自己的状态，又计算新的颜色。怎样拆开，调用的人才能不看实现就放心使用？"},
 {h:'例：调漆',dur:10,c:'原来的 Paint.mixIn() 把另一桶漆混进来，同时改了自己的体积和颜色，<b>被混进来的那桶漆的体积却没变</b>。读代码的人必须看实现才知道发生了什么。',q:'看起来并不是十分合乎逻辑……我们似乎为Paint分配了两种不同的基本职责。让我们试着把它们分开。（第 10 章）'},
 {h:'分离命令与函数',dur:10,c:'把颜色提取为不可变的 VALUE <b>Pigment Color</b>，混色变成无副作用的函数 mixedWith()，返回新颜色，结果仍然是 Pigment Color（<b>闭合操作</b>）。Paint 只保留一个命令 mixIn()，再用 <b>ASSERTION</b> 写明它的后置条件。',q:'现在只有一个命令，即mixIn()……所有其他操作都是SIDE-EFFECT-FREE FUNCTION。（第 10 章）'},
 {h:'柔性设计的样子',dur:9,c:'这一组模式让设计像用旧的手套：经常弯曲的地方变得柔软，其他地方仍然坚固。<b>释意接口</b>让名字说明意图；<b>概念轮廓</b>让拆分沿着领域的自然边界；<b>独立的类</b>减少依赖。',q:'戴久了的手套在手指关节处会变得柔软；而其他部分则依然硬实。（第 10 章）'}
],
draw(s){
 const {W,H,t}=s,n=s.narrow;
 const a0=solo(s,0),a1=solo(s,1),a2=solo(s,2),a3=solo(s,3),a4=s.v(4);
 layer(a0,()=>{
  const cw=n?W-24:Math.min(440,W*.46),x=n?12:W*.06,y=H*.16;
  const c=code(['if (invoice.dueDate + 20 < today','    && invoice.amount > invoice.paid','    && !customer.hasCredit','    && …) {','  // 这到底是什么规则？','}'],x,y,cw,{size:n?9.5:11.5,hl:[0,1,2]});
  const px=n?W/2:x+cw+(W-x-cw)/2,py=n?y+c.h+70:y+c.h/2;
  const p=E.io(clamp((s.age-2)/1.5));
  layer(p,()=>{const b=pill('DelinquentInvoiceSpecification',px,py,{size:n?10:12,f:'m',bg:C.acc});hotR(b.x,b.y,b.w,b.h,'把规则命名','条件判断被提炼成一个有名字的领域对象，团队用这个词讨论，它在代码里也有一个明确的家。');
   if(!n)arrow(x+cw+8,y+c.h/2,b.x-6,py,C.acc,1.4);else arrow(W/2,y+c.h+8,W/2,b.y-6,C.acc,1.4)});
  hotR(x,y,cw,c.h,'隐式的规则','规则被埋在条件判断里，名字不在通用语言中出现，别人很难看出这就是“拖欠”。');
  txt('约束 · 过程 · 规则 → 显式的对象',W/2,H*.85,{size:n?11.5:13.5,w:700,color:C.acc,f:'d'});
 });
 layer(a1,()=>{
  const N=n?12:18,cols=n?4:6,gw=n?W*.2:Math.min(84,W*.1),gh=n?44:52,x0=W/2-cols*gw/2,y0=H*.12;
  const sp=specOn;
  for(let i=0;i<N;i++){
   const due=Math.round(rnd(i+3)*60),paid=rnd(i+8)>.45,bad=due>20&&!paid;
   const r=Math.floor(i/cols),c=i%cols,x=x0+c*gw+gw/2,y=y0+r*(gh+10)+gh/2;
   const pass=sp?bad:true;
   layer(sp&&!bad?.25:1,()=>{
    box(x-gw/2+4,y-gh/2,gw-8,gh,{fill:C.sheet,stroke:sp&&bad?C.red:C.line,lw:sp&&bad?1.8:1});
    txt('#'+(1040+i),x,y-gh*.2,{size:n?9:10.5,f:'m',w:700});
    txt((paid?'已付':'未付')+' · '+due+'天',x,y+gh*.2,{size:n?8.5:10,color:paid?C.acc:C.amber});
    hotR(x-gw/2+4,y-gh/2,gw-8,gh,'发票 #'+(1040+i),'逾期 '+due+' 天，'+(paid?'已付清':'未付清')+'。isSatisfiedBy() = '+(bad?'true（拖欠）':'false'));
   });
  }
  const cy=H*(n?.62:.6),uses=[['验证','spec.isSatisfiedBy(invoice)','检查一个对象是否满足要求。'],['选择','repo.selectSatisfying(spec)','从集合中找出所有满足条件的对象，查询可以被翻译成 SQL。'],['根据要求创建','builder.build(spec)','按规格生成新对象，例如按路线规格生成航线。']];
  uses.forEach((u,i)=>{const x=n?W/2:W*(.2+i*.3),y=n?cy+i*48:cy+20;const b=pill(u[0],x,y,{size:n?10.5:12,bg:C.acc,f:'d'});txt(u[1],x,y+(n?18:24),{size:n?8.5:10,f:'m',color:C.muted});hotR(b.x,b.y,b.w,b.h+24,'用途：'+u[0],u[2])});
 });
 // paint
 const pc=(x,y,r,col,vol,l)=>{const h=r*1.6*vol;box(x-r,y-r*.8,r*2,r*1.6,{stroke:C.ink,lw:1.4,r:6});box(x-r+3,y+r*.8-h,r*2-6,Math.max(0,h-3),{fill:col,r:4});txt(l,x,y+r+16,{size:n?9.5:11,f:'m'})};
 layer(a2,()=>{
  const r=n?28:38,y=H*.3,x1=W*(n?.2:.25),x2=W*(n?.5:.5),x3=W*(n?.8:.75);
  const p=E.io(clamp((s.age-1.2)/2));
  pc(x1,y,r,C.blue,lerp(.45,.9,p),'paint1');
  pc(x2,y,r,C.amber,.45,'paint2');
  hotR(x1-r,y-r,r*2,r*2+20,'paint1.mixIn(paint2)','paint1 的体积增加，颜色变了。');
  hotR(x2-r,y-r,r*2,r*2+20,'paint2','它的漆已经倒进去了，体积却没有变化。这个副作用（或没有副作用）在接口上看不出来。');
  const [dx,dy]=along(x2,y-r,x1,y-r,p);layer(1-p,()=>dot(dx,dy-6*Math.sin(p*Math.PI),5,C.amber));
  layer(p,()=>{pill('体积没变？',x2,y-r-18,{size:n?9.5:11,bg:C.red})});
  const cw=n?W-24:Math.min(560,W*.6);
  code(['public void mixIn(Paint other) {','  volume = volume + other.getVolume();','  // 复杂的混色逻辑，修改 red / yellow / blue','}'],W/2-cw/2,H*(n?.58:.56),cw,{size:n?9:11,hl:[1]});
 });
 layer(a3,()=>{
  const r=n?24:34,y=H*.24,cx=W/2;
  const xs=n?[W*.18,W*.5,W*.82]:[W*.25,W*.5,W*.75];
  const cols=[[C.blue,'Pigment(蓝)'],[C.amber,'Pigment(黄)'],['#3E9E5B','Pigment(绿)']];
  cols.forEach(([c,l],i)=>{dot(xs[i],y,r,c);txt(l,xs[i],y+r+14,{size:n?9:10.5,f:'m'});
   hotC(xs[i],y,r,l,i<2?'Pigment Color 是不可变的 VALUE OBJECT。':'mixedWith() 返回一个新的 Pigment Color，原来的两个颜色都没变。结果和参数是同一类型，这就是闭合操作。')});
  txt('mixedWith',(xs[0]+xs[1])/2,y,{size:n?9:11,f:'m',color:C.muted});txt('=',(xs[1]+xs[2])/2,y,{size:18,w:700,color:C.muted});
  const cw=n?W-24:Math.min(600,W*.7),cy=H*(n?.42:.44);
  const c=code(['class PigmentColor {  // VALUE，不可变','  PigmentColor mixedWith(PigmentColor other, double ratio)','}','class Paint {','  void mixIn(Paint other)   // 唯一的命令','  // ASSERTION: 之后 other.volume == 0','}'],W/2-cw/2,cy,cw,{size:n?8.5:11,hl:[1,4,5]});
  hotR(W/2-cw/2,cy,cw,c.h,'SIDE-EFFECT-FREE FUNCTION + ASSERTION','查询与命令分开：函数没有副作用，可以随意组合和测试；命令只有一个，并用断言写明执行后的状态。');
 });
 layer(a4,()=>{
  const cx=W/2,cy=H*.4,s0=Math.min(W,H)*(n?.32:.3);

{nav:'限界上下文',chap:'第 14 章 · 保持模型的完整性',title:'盲人摸象与 BOUNDED CONTEXT',

 {bg:1,h:"背景：一个古老的寓言",dur:15,c:"印度有个寓言：几个盲人第一次遇到大象，每人摸到一个部位，就以为大象是那个样子。每个人说得都有道理，但都只是一部分。Evans 用它来比喻大型项目：好几个团队各自为自己负责的那部分建模。",terms:[["盲人","一个团队或一个子系统，只接触到业务的一部分。"],["各自的说法","每个团队的模型，在自己的范围内是对的，也好用。"],["大象","整个业务领域，很少有人能看清全貌。"]],ask:"这些模型需要对接时，应该硬拼成一个，还是划清边界、各自保持一致？"},
 {h:'六个盲人摸大象',dur:9.5,c:'摸到身体的说大象像<b>墙</b>，摸到鼻子的说像<b>蛇</b>，摸到膝盖的说像<b>树</b>，摸到尾巴的说像<b>绳子</b>。大型项目里各个团队的模型也是这样：每个都对了一部分。',q:'尽管他们每人都有正确的地方，但从整体上都是错误的!（第 14 章）'},

draw(s){

  [-.25,-.05,.12,.22].forEach(x=>{box(es*x-es*.04,es*.15,es*.08,es*.25,{fill:rgba(C.muted,.2),stroke:C.muted,r:4})});
  ctx.beginPath();ctx.moveTo(es*.44,-es*.06);ctx.quadraticCurveTo(es*.56,es*.12,es*.5,es*.3);ctx.lineWidth=es*.05;ctx.strokeStyle=rgba(C.muted,.45);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-es*.41,-es*.04);ctx.lineTo(-es*.55,es*.12);ctx.lineWidth=2;ctx.strokeStyle=C.muted;ctx.stroke();
  ctx.restore()});
 layer(a0,()=>{
  elephant(1);
  parts.forEach((p,i)=>{const x=ex+p[2]*es,y=ey+p[3]*es;const bx=n?x:x+(p[2]>0?es*.22:-es*.22),by=y+(p[3]>0?es*.22:-es*.22)*(n?.8:1);

    const b=pill('“像'+p[0]+'”',bx,by,{size:n?10:12,bg:LEND()[i%3],f:'d'});person(bx,by-(n?24:30),n?7:9,LEND()[i%3]);

  });
 });
 layer(a1,()=>{
  const st=n?[[W*.5,H*.16],[W*.5,H*.4],[W*.5,H*.64]]:[[W*.2,H*.45],[W*.5,H*.45],[W*.8,H*.45]];
  const rr0=Math.min(W,H)*(n?.09:.13);
  const lab=[['粗糙集成','墙 + 树干 + 绳子 + 蛇',C.red,'“把大象看成一堵墙，下面通过树干支撑着，一头儿是一根绳子，另一头儿是一条蛇。”拼接出来的模型更糟。'],['毒牙的教训','宁缺毋滥',C.amber,'“蛇”的模型带着毒牙。书中说：宁可缺少喷水功能，也不要包含不正确的毒牙特性。'],['更深的模型','这是一只动物',C.acc,'统一多个模型，几乎总是意味着创建一个新模型。']];
  lab.forEach((L0,i)=>{const [x,y]=st[i];layer(clamp(s.age-i*1.2),()=>{
   if(i===0){box(x-rr0,y-rr0*.6,rr0*1.4,rr0*1,{fill:rgba(C.muted,.3),stroke:C.muted});[-.6,.2].forEach(k=>box(x+k*rr0,y+rr0*.4,rr0*.2,rr0*.6,{fill:rgba('#7A5A3A',.5)}));seg(x-rr0,y-rr0*.2,x-rr0*1.4,y+rr0*.3,C.ink,1.6);curve(x+rr0*.4,y-rr0*.2,x+rr0*1.1,y-rr0*.8,x+rr0*1.2,y+rr0*.2,'#3E9E5B',3)}
   else if(i===1){curve(x-rr0,y,x,y-rr0*1.2,x+rr0*.6,y,'#3E9E5B',5);dot(x+rr0*.7,y,rr0*.18,'#3E9E5B');txt('✗ 毒牙',x+rr0*.9,y+rr0*.4,{size:n?10:11,w:700,color:C.red})}
   else{ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.ellipse(0,0,rr0*.9,rr0*.6,0,0,TAU);ctx.fillStyle=rgba(C.acc,.2);ctx.fill();ctx.strokeStyle=C.acc;ctx.lineWidth=1.6;ctx.stroke();ctx.restore();txt('动物',x,y,{size:n?13:16,w:700,f:'d',color:C.acc})}
   const ly=y+rr0*(n?1:1.3);txt(L0[0],x,ly,{size:n?11:13,w:700,f:'d',color:L0[2]});txt(L0[1],x,ly+(n?16:20),{size:n?9.5:11,color:C.muted});
   hotR(x-rr0*1.3,y-rr0*1.1,rr0*2.6,rr0*2.4+30,L0[0],L0[3]);
   if(i<2&&!n)arrow(x+rr0*1.5,y,st[i+1][0]-rr0*1.5,y,C.muted,1.2)})});
 });
 // contexts layout shared by step 2 and 3
 const CTX=[['订舱','Booking',.22,.3,C.blue],['航线规划','Routing',.62,.22,C.violet],['计费','Billing',.2,.72,C.amber],['旧系统','Legacy',.84,.62,C.muted],['事件处理','Handling',.52,.66,C.acc]];
 const cxy=i=>[W*(n?lerp(.18,.82,(CTX[i][2]-.2)/.64):CTX[i][2]),H*(n?CTX[i][3]*.85+.04:CTX[i][3]*.92)];
 const REL=[[0,1,'CUSTOMER/SUPPLIER','客户/供应商','上下游团队协作：下游把需求提给上游，双方一起定验收测试，上游的计划要考虑下游。'],[0,4,'SHARED KERNEL','共享内核','两个团队共享模型的一个子集（以及对应代码），任何修改都要双方商量并通过测试。'],[0,3,'ANTICORRUPTION LAYER','防腐层','创建一个隔离层，以便根据客户自己的领域模型来为客户提供相关功能……在两个模型之间进行必要的双向转换。'],[2,0,'CONFORMIST','跟随者','下游团队没有影响力，干脆完全采用上游的模型，省去翻译。'],[1,4,'OPEN HOST SERVICE','开放主机服务','把子系统的访问定义成一组服务协议，开放给所有需要集成的系统。'],[2,3,'SEPARATE WAYS','各行其道','集成的代价大于收益时，就别集成。各自独立开发简单、专门的方案。'],[1,3,'PUBLISHED LANGUAGE','公开发布的语言','用一种文档完善的共享语言（例如行业标准 XML 格式）作为交换的媒介。']];
 const ctxA=Math.max(a2,a3);
 layer(ctxA,()=>{
  const R=Math.min(W,H)*(n?.1:.11);
  layer(a3,()=>{REL.forEach((r,i)=>{const [x1,y1]=cxy(r[0]),[x2,y2]=cxy(r[1]);const mx=(x1+x2)/2,my=(y1+y2)/2;
   const hl=ctxRel===i;seg(x1,y1,x2,y2,hl?C.acc:rgba(C.ink,.35),hl?2.5:1.4,i===5?[5,5]:null);
   const b=pill(n?r[2].split(/[ /]/)[0]:r[2],mx,my,{size:n?7.5:9.5,f:'m',bg:hl?C.acc:C.sheet,color:hl?C.sheet:C.ink,stroke:C.line,pad:n?4:6});
   if(live())HOT.push({k:'r',x:b.x-4,y:b.y-4,w:b.w+8,h:b.h+8,t:r[3]+' · '+r[2],b:r[4],click:()=>{ctxRel=ctxRel===i?-1:i}})});});

{nav:'精炼与结构',chap:'第 15–17 章 · 精炼、大型结构、战略设计',title:'把力气花在 CORE DOMAIN 上',
steps:[
 {h:'找到核心领域',dur:9.5,c:'系统里不是所有部分都一样重要。<b>CORE DOMAIN</b> 是让系统有价值、和别人不同的部分。要尽量把它压缩得小一些，并且<b>让最有才能的人来开发它</b>。',q:'尽量压缩CORE DOMAIN……让最有才能的人来开发CORE DOMAIN。（第 15 章）'},
 {h:'一个反例：时区',dur:9,c:'书中说，作者两次亲眼看到项目里最好的开发人员花好几周时间去解决时区的存储和转换问题。这些工作很必要，但属于 <b>GENERIC SUBDOMAIN</b>，可以买现成方案或外包，不该占用核心人员。'},
 {h:'精炼的手段',dur:10,c:'从轻到重：写一页<b>领域愿景说明</b>；<b>突出核心</b>（标记核心元素）；把通用机制提取为<b>内聚机制</b>；把核心从支撑代码中剥离成<b>分离的核心</b>；最后是<b>抽象内核</b>。',q:'每种技术都需要我们连续不断地投入越来越多的工作，但刀磨得越薄，就会越锋利。（第 15 章）'},
 {bg:1,h:"背景：五层职责是什么意思",dur:15,c:"书中用一家<b>航运公司</b>的系统来说明“职责层”。系统大到几百个类以后，光看代码很难理解整体。把对象按它在业务中承担的职责分成几层，就有了一张能看清全局的大图。每一层回答一个不同的问题。",terms:[["潜能 Potential","能做什么？比如拥有的船舶、运力和设施。"],["作业 Operation","正在做什么、做过什么？比如货物现在在哪里、哪段航程正在执行。"],["决策支持 Decision Support","应该做什么？比如路线规划、运力分析。"],["策略 Policy","规则和目标是什么？比如超订比例、危险品的运输规定。"],["承诺 Commitment","答应了客户什么？比如服务协议和订舱承诺。"]],ask:"注意依赖方向：上层可以使用下层，下层不知道上层的存在。"},
 {h:'大型结构：职责层',dur:10,c:'系统大到一定程度，需要一个能让人看清整体的结构。书中的例子是按职责分层：<b>潜能 → 作业 → 决策支持 → 策略 → 承诺</b>。下层不能依赖上层。悬停查看每层的问题。'},

],

/* ---------------- 9 · Epilogue ---------------- */
{nav:'结语',chap:'结语 · 回顾',title:'建模需要想象力和自律',
steps:[
 {h:'全书地图',dur:10,c:'回到起点：<b>知识消化</b>产生模型，<b>通用语言</b>让模型和代码保持一致，<b>构造块</b>把模型落到代码，<b>重构</b>带来突破，<b>战略设计</b>让大系统保持完整。点击任意节点回到对应场景。'},
 {h:'这些项目后来怎样了',dur:10,c:'书末回顾了几个项目的结局。好的模型不能保证商业成功，但它让软件能长期演进。悬停每张卡片查看。'},
 {h:'最后一句话',dur:9,c:'领域驱动设计不是一套框架，而是一种做软件的方式：持续学习领域，持续改进模型，让代码说出领域的语言。',q:'创建好的软件是一项需要学习和思考的活动。建模需要想象力和自律。（结语）'}
],
draw(s){
 const {W,H,t}=s,n=s.narrow;
 const a0=solo(s,0),a1=solo(s,1),a2=s.v(2);

  const nodes=[['知识消化',0,.5,.12],['通用语言',1,.2,.32],['分层架构',2,.8,.32],['构造块',3,.15,.58],['聚合',4,.42,.58],['突破',5,.7,.56],['柔性设计',6,.88,.72],['限界上下文',7,.3,.84],['精炼与结构',8,.62,.86]];

/* ====================================================================
   ENGINE
   ==================================================================== */
const FLAT=[];SCENES.forEach((sc,si)=>{let a=0;sc.steps.forEach((st,k)=>{FLAT.push({si,k,st,ak:st.bg?Math.max(0,a-1):a});if(!st.bg)a++})});
const bgEl=$('#bgcard');
let cur=0,sceneIdx=-1,sf=-1,sceneT=0,sceneFade=0,stepClock=0,stepAge=0,playing=!REDUCED;
const nav=$('#nav'),track=$('#track');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.textContent=sc.nav;b.onclick=()=>jumpScene(i);nav.appendChild(b)});
const segEls=SCENES.map((sc,i)=>{const d=document.createElement('div');d.className='seg';d.style.flex=`${sc.steps.length} 1 0`;d.title=sc.nav;d.innerHTML='<i></i>';track.appendChild(d);return d});
const firstOf=si=>FLAT.findIndex(f=>f.si===si);
function jumpScene(si){go(firstOf(si),true)}
function enterScene(si,k,fromStart){
 sceneIdx=si;sceneT=0;sceneFade=REDUCED?1:0;sf=fromStart?k-1:k;
 const sc=SCENES[si],ctrl=$('#ctrl');
 if(sc.ctrl){ctrl.innerHTML=sc.ctrl;ctrl.hidden=false}else{ctrl.innerHTML='';ctrl.hidden=true}
 sc.enter&&sc.enter();
 [...nav.children].forEach((b,i)=>b.setAttribute('aria-current',i===si?'true':'false'));
 try{history.replaceState(null,'','#s'+si)}catch(e){}
}
function go(i,fromStart){
 i=clamp(i,0,FLAT.length-1);const prev=FLAT[cur];const f=FLAT[i];
 const forward=i>cur;cur=i;stepClock=0;stepAge=0;
 if(f.si!==sceneIdx)enterScene(f.si,f.ak,fromStart||forward);
 panel();
}
function panel(){
 const f=FLAT[cur],sc=SCENES[f.si];
 $('#chap').textContent=sc.chap;$('#stitle').textContent=sc.title;
 $('#steps').innerHTML=sc.steps.map((_,k)=>`<i class="${k<=f.k?'on':''}"></i>`).join('')+`<span>${f.k+1} / ${sc.steps.length}</span>`;
 $('#caph').textContent=f.st.h;$('#cap').innerHTML=f.st.bg?'画面里是这个例子的业务背景和关键术语。读完后进入下一步，再看动画演示。':f.st.c;
 const q=$('#quote');if(f.st.q){q.innerHTML='<small>原书要点</small>'+f.st.q;q.hidden=false}else q.hidden=true;
 {const c=$('#ctrl');c.hidden=!!f.st.bg||!(sc.ctrl&&(!sc.ctrlSteps||sc.ctrlSteps.includes(f.ak)))}
 if(f.st.bg){bgEl.innerHTML=`<div class="bgin"><div class="bgtag">例子背景</div><h4>${f.st.h.replace(/^背景：/,'')}</h4><p>${f.st.c}</p><dl>${f.st.terms.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl><div class="bgask">${f.st.ask}</div><div class="bgnext">按 → 或“下一步”进入例子</div></div>`;bgEl.hidden=false;bgEl.scrollTop=0}else{bgEl.hidden=true}
 $('#count').textContent=String(cur+1).padStart(2,'0')+' / '+String(FLAT.length).padStart(2,'0');
}
function setPlay(p){playing=p;$('#play').setAttribute('aria-label',p?'暂停':'播放');$('#playIcon').innerHTML=p?'<path d="M4 2h3v12H4zM9 2h3v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>'}
$('#play').onclick=()=>{if(!playing&&cur===FLAT.length-1&&stepClock>=FLAT[cur].st.dur){go(0,true)}setPlay(!playing)};
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
track.addEventListener('click',e=>{const r=track.getBoundingClientRect();const fr=clamp((e.clientX-r.left)/r.width);
 // map through segment widths
 let acc=0;for(let i=0;i<segEls.length;i++){const sr=segEls[i].getBoundingClientRect();if(e.clientX<=sr.right+2.5||i===segEls.length-1){const loc=clamp((e.clientX-sr.left)/sr.width);const n=SCENES[i].steps.length;go(firstOf(i)+Math.min(n-1,Math.floor(loc*n)),true);return}}});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.target===track)return;
 if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}else if(e.key===' '){setPlay(!playing);e.preventDefault()}});

// tooltip
let mouse=null,hoverHot=null;
function showTip(){
 if(!mouse){tip.hidden=true;cv.style.cursor='default';return}
 const h=hit(mouse.x,mouse.y);hoverHot=h;
 if(!h){tip.hidden=true;cv.style.cursor='default';return}
 cv.style.cursor=h.click?'pointer':'help';
 if(tip.dataset.key!==h.t+h.b){tip.innerHTML=`<b>${h.t}</b>${h.b}`;tip.dataset.key=h.t+h.b}
 tip.hidden=false;
 const tw0=tip.offsetWidth,th0=tip.offsetHeight;let x=mouse.x+16,y=mouse.y+16;
 if(x+tw0>W-8)x=mouse.x-tw0-14;if(x<8)x=8;if(y+th0>H-8)y=mouse.y-th0-14;if(y<8)y=8;
 tip.style.left=x+'px';tip.style.top=y+'px';
}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top}});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){mouse=null}});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top};const h=hit(mouse.x,mouse.y);if(h&&h.click){h.click();mouse=null}else if(!h&&e.pointerType!=='mouse'){mouse=null}});

let last=performance.now();
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;
 readColors();
 const st=FLAT[cur].st;
 stepAge+=dt;
 if(playing){stepClock+=dt;if(stepClock>=st.dur){if(cur<FLAT.length-1)go(cur+1);else{stepClock=st.dur;setPlay(false)}}}
 sceneT+=dt;sceneFade=Math.min(1,sceneFade+dt/.7);
 const target=FLAT[cur].ak,diff=target-sf;
 if(REDUCED)sf=target;else{const sp=Math.max(1/1.1,Math.abs(diff)*1.8)*dt;sf+=Math.sign(diff)*Math.min(Math.abs(diff),sp)}
 // render
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);HOT=[];
 const a=E.out(sceneFade);
 const S={W,H,t:sceneT,dt,sf,age:stepAge,step:target,narrow:W<560,raw:k=>clamp(sf-k+1),v:k=>E.io(clamp(sf-k+1))};
 ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*16);
 try{SCENES[sceneIdx].draw(S)}catch(err){console.error(err)}
 ctx.restore();
 showTip();
 // progress
 const gp=cur+clamp(stepClock/st.dur);
 segEls.forEach((el,i)=>{const s0=firstOf(i),n=SCENES[i].steps.length;const f=clamp((gp-s0)/n);el.firstChild.style.width=(f*100)+'%';el.classList.toggle('past',gp>=s0+n)});
 track.setAttribute('aria-valuenow',cur+1);track.setAttribute('aria-valuemax',FLAT.length);
 requestAnimationFrame(frame);
}
readColors();
const hs=/^#s(\d)$/.exec(location.hash);
go(hs?firstOf(clamp(+hs[1],0,SCENES.length-1)):0,true);
setPlay(playing);
requestAnimationFrame(frame);
})();
