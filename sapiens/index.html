<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人类简史 · 动态解读</title>
<meta name="description" content="用动画解读尤瓦尔·赫拉利《人类简史：从动物到上帝》：认知革命、农业革命、人类的融合统一、科学革命。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23A4521E'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23FBF7EE' font-family='serif' font-weight='900'%3E史%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: drafting-table stage (canvas sheet + annotation rail) above a tape-transport bar */
:root{
  --paper:#F1ECE1; --sheet:#FBF7EE; --ink:#1A1F2E; --muted:#686D79; --line:#D9D6CC;
  --grid:rgba(140,90,40,.07); --grid2:rgba(140,90,40,.035);
  --red:#E5432A; --blue:#2463EB; --amber:#E39500; --teal:#0C9C7B; --violet:#7A48D8;
  --tar:#2B2622; --soft:#EAE3D4; --grain:.35; --acc:#A4521E;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14110D; --sheet:#1B1712; --ink:#ECE8DE; --muted:#8E94A3; --line:#3A3229;
    --grid:rgba(240,170,100,.06); --grid2:rgba(240,170,100,.03);
    --red:#FF6448; --blue:#5B8CFF; --amber:#FFBE3B; --teal:#2DD4A7; --violet:#A884FF;
    --tar:#05070B; --soft:#2A241D; --grain:.18; --acc:#F0A060; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14110D; --sheet:#1B1712; --ink:#ECE8DE; --muted:#8E94A3; --line:#3A3229;
  --grid:rgba(240,170,100,.06); --grid2:rgba(240,170,100,.03);
  --red:#FF6448; --blue:#5B8CFF; --amber:#FFBE3B; --teal:#2DD4A7; --violet:#A884FF;
  --tar:#05070B; --soft:#2A241D; --grain:.18; --acc:#F0A060; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:20px 28px;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:16px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.seal{width:44px;height:44px;border-radius:4px;background:var(--acc);color:var(--sheet);display:grid;place-items:center;font:900 15px/1 var(--f-display);letter-spacing:.02em;flex:none}
.brand h1{font:900 26px/1.1 var(--f-display);margin:0;letter-spacing:.06em}
.brand p{margin:3px 0 0;font:500 10.5px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{font:500 13px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:8px 11px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button[aria-current="true"]{color:var(--sheet);background:var(--ink)}
.nav button:focus-visible,.btn:focus-visible,.track:focus-visible,.theme:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;font-size:15px;display:grid;place-items:center}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.sheet{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hint{position:absolute;left:12px;top:10px;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em;pointer-events:none}
.tip{position:absolute;pointer-events:none;max-width:290px;background:var(--ink);color:var(--sheet);padding:10px 13px 11px;border-radius:6px;font-size:13px;line-height:1.65;box-shadow:0 10px 30px -12px rgba(0,0,0,.45);z-index:3}
.tip b{display:block;font:600 14.5px/1.4 var(--f-display);margin-bottom:3px;color:var(--sheet)}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:2px}
.eyebrow{font:700 11px/1 var(--f-mono);color:var(--acc);letter-spacing:.14em;text-transform:uppercase}
.rail h2{font:900 27px/1.25 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.02em}
.steps{display:flex;gap:5px;align-items:center}
.steps i{width:18px;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ink)}
.steps span{font:500 11px var(--f-mono);color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.rail h3{font:700 17px/1.4 var(--f-body);margin:6px 0 0}
.rail p{margin:0;font-size:14.5px;line-height:1.85;color:var(--ink)}
.rail p b{color:var(--acc);font-weight:700}
blockquote{margin:4px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--acc);font:600 14.5px/1.7 var(--f-display);color:var(--ink)}
blockquote small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
[hidden]{display:none!important}
.ctrl{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;margin-top:4px}
.ctrl label{font:700 13px var(--f-body);display:flex;justify-content:space-between;align-items:baseline}
.ctrl output{font:700 20px var(--f-mono);color:var(--acc);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--acc)}
.ctrl .note{font-size:12.5px;line-height:1.6;color:var(--muted)}
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:6px}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .2s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.94)}
.btn.play{background:var(--ink);color:var(--sheet);border-color:var(--ink);width:46px;height:46px}
.btn svg{width:16px;height:16px;fill:currentColor}
.track{flex:1 1 280px;min-width:0;display:flex;gap:5px;height:30px;align-items:center;cursor:pointer}
.seg{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;min-width:8px}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
.seg.past i{background:var(--ink)}
.count{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.keys{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.04em}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}.sheet{aspect-ratio:4/3}.nav{margin-left:0;width:100%}}
@media (max-width:560px){.sheet{aspect-ratio:4/5}.brand h1{font-size:22px}.rail h2{font-size:23px}.keys{display:none}.nav button{padding:7px 9px;font-size:12.5px}}
.ctrl .lbl{font:700 13px var(--f-body)}
.segbtns{display:flex;flex-wrap:wrap;gap:6px}
.segbtns button{flex:1 1 auto;font:600 12.5px/1.25 var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer;transition:background .2s,color .2s}
.segbtns button:hover{background:var(--soft)}
.segbtns button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.segbtns button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bgcard{position:absolute;inset:0;z-index:3;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(3px);display:flex;padding:28px 34px}
.bgin{margin:auto;max-width:640px;width:100%;animation:bgup .5s ease-out}
@keyframes bgup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bgtag{display:inline-block;font:700 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--sheet);background:var(--acc);padding:6px 9px;border-radius:3px}
.bgcard h4{font:900 26px/1.3 var(--f-display);margin:12px 0 10px;color:var(--ink)}
.bgcard p{margin:0 0 14px;font-size:14.5px;line-height:1.85;color:var(--ink)}
.bgcard b{color:var(--acc)}
.bgcard dl{display:grid;grid-template-columns:max-content 1fr;gap:9px 16px;margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.bgcard dt{font:700 13.5px/1.6 var(--f-body);color:var(--acc)}
.bgcard dd{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink)}
.bgask{font:600 14.5px/1.7 var(--f-display);border-left:2px solid var(--amber);padding-left:12px;color:var(--ink)}
.bgnext{margin-top:14px;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
@media (max-width:560px){.bgcard{padding:18px 16px}.bgcard h4{font-size:21px}.bgcard dl{grid-template-columns:1fr;gap:2px}.bgcard dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="seal">简史</div>
      <div><h1>人类简史</h1><p>Sapiens · Yuval Noah Harari · 从动物到上帝</p></div>
    </div>
    <nav class="nav" id="nav" aria-label="章节"></nav>
    <button class="theme" id="theme" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
  </header>

  <main class="stage">
    <div class="sheet" id="sheet">
      <canvas id="cv" aria-label="动态示意图"></canvas>
      <div class="hint">HOVER · 悬停图形查看详解</div>
      <div class="tip" id="tip" hidden></div>
      <div class="bgcard" id="bgcard" hidden></div>
    </div>
    <aside class="rail" aria-live="polite">
      <div class="eyebrow" id="chap"></div>
      <h2 id="stitle"></h2>
      <div class="steps" id="steps"></div>
      <h3 id="caph"></h3>
      <p id="cap"></p>
      <blockquote id="quote" hidden></blockquote>
      <div class="ctrl" id="ctrl" hidden></div>
    </aside>
  </main>

  <footer class="transport">
    <div class="btns">
      <button class="btn" id="prev" aria-label="上一步"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="btn play" id="play" aria-label="暂停"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button class="btn" id="next" aria-label="下一步"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="播放进度"></div>
    <div class="count" id="count">01 / 01</div>
    <div class="keys">← → 切换 · 空格 播放/暂停</div>
  </footer>
</div>


<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const E={
  io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  out:t=>1-Math.pow(1-t,3),
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  expo:t=>t>=1?1:1-Math.pow(2,-10*t)
};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv=$('#cv'),ctx=cv.getContext('2d'),sheet=$('#sheet'),tip=$('#tip');
let W=0,H=0,DPR=1;
function resize(){const r=sheet.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
new ResizeObserver(resize).observe(sheet);resize();

/* ---------- theme ---------- */
let C={};
const KEYS=['paper','sheet','ink','muted','line','red','blue','amber','teal','violet','tar','soft','acc'];
function readColors(){const cs=getComputedStyle(document.documentElement);KEYS.forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
function rgba(hex,a){hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
$('#theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};

/* ---------- drawing helpers ---------- */
const FD='"Noto Serif SC","Songti SC",serif',FB='"Noto Sans SC","PingFang SC",system-ui,sans-serif',FM='"JetBrains Mono",ui-monospace,Menlo,monospace';
const font=(size,w=500,f='b')=>`${w} ${size}px ${f==='d'?FD:f==='m'?FM:FB}`;
function txt(s,x,y,o={}){ctx.save();ctx.font=font(o.size||13,o.w||500,o.f);ctx.fillStyle=o.color||C.ink;ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';if(o.a!=null)ctx.globalAlpha*=o.a;ctx.fillText(s,x,y);ctx.restore()}
function tw(s,size,w=500,f){ctx.save();ctx.font=font(size,w,f);const m=ctx.measureText(s).width;ctx.restore();return m}
function dot(x,y,r,fill,stroke,lw=1.5){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function seg(x1,y1,x2,y2,color,lw=1,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
function arrow(x1,y1,x2,y2,color,lw=1.5,head=8){seg(x1,y1,x2,y2,color,lw);const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function pill(s,x,y,o={}){const size=o.size||12,pad=o.pad||9,w=tw(s,size,o.w||600,o.f)+pad*2,h=size+pad*1.1;const x0=o.align==='left'?x:o.align==='right'?x-w:x-w/2;rr(x0,y-h/2,w,h,h/2);ctx.fillStyle=o.bg||C.ink;ctx.fill();if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=1;ctx.stroke()}txt(s,x0+w/2,y+.5,{size,w:o.w||600,color:o.color||C.sheet,f:o.f});return {x:x0,y:y-h/2,w,h}}
function layer(a,fn){if(a<=.004)return;ctx.save();ctx.globalAlpha*=Math.min(1,a);fn();ctx.restore()}
function glow(x,y,r,color,a){if(r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
const along=(x1,y1,x2,y2,p)=>[lerp(x1,x2,p),lerp(y1,y2,p)];

/* ---------- hotspots ---------- */
let HOT=[];
const live=()=>ctx.globalAlpha>.45;
function hotC(x,y,r,t,b,click){if(live())HOT.push({k:'c',x,y,r,t,b,click})}
function hotR(x,y,w,h,t,b,click){if(live())HOT.push({k:'r',x,y,w,h,t,b,click})}
function hotF(fn,t,b){if(live())HOT.push({k:'f',fn,t,b})}
function hit(mx,my){for(let i=HOT.length-1;i>=0;i--){const h=HOT[i];if(h.k==='c'&&Math.hypot(mx-h.x,my-h.y)<=h.r)return h;if(h.k==='r'&&mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h)return h;if(h.k==='f'&&h.fn(mx,my))return h}return null}


/* ---------- DDD-specific helpers ---------- */
function box(x,y,w,h,o={}){rr(x,y,w,h,o.r==null?6:o.r);if(o.fill){ctx.fillStyle=o.fill;ctx.fill()}if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw||1.2;if(o.dash)ctx.setLineDash(o.dash);ctx.stroke();if(o.dash)ctx.setLineDash([])}}
function curve(x1,y1,qx,qy,x2,y2,color,lw=1.4,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(qx,qy,x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
function curveArrow(x1,y1,qx,qy,x2,y2,color,lw=1.4,head=7){curve(x1,y1,qx,qy,x2,y2,color,lw);const a=Math.atan2(y2-qy,x2-qx);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
const qpt=(x1,y1,qx,qy,x2,y2,p)=>{const u=1-p;return [u*u*x1+2*u*p*qx+p*p*x2,u*u*y1+2*u*p*qy+p*p*y2]};
function poly(pts,p){let L=0;const d=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(l);L+=l}let r=clamp(p)*L;for(let i=0;i<d.length;i++){if(r<=d[i]||i===d.length-1){const f=d[i]?clamp(r/d[i]):0;return along(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],f)}r-=d[i]}return pts[0]}
function polyline(pts,color,lw=1.4,dash){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.stroke();if(dash)ctx.setLineDash([])}
const solo=(s,k)=>(k?s.v(k):1)*(1-s.v(k+1));
const mkClock=()=>{let key=null,t0=0;return (s,x='')=>{const k=s.step+'|'+x;if(k!==key){key=k;t0=s.t}return REDUCED?99:s.t-t0}};
// rich text: CJK wraps per char, latin words and highlighted terms stay whole
const LC=new Map();
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>LC.clear());
const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function toks(s,terms){const out=[];const plain=p=>(p.match(/[A-Za-z0-9_.()<>!=$,#]+|\s|./gu)||[]).forEach(c=>out.push({s:c}));
 if(terms&&terms.length){const re=new RegExp('('+terms.map(esc).join('|')+')');s.split(re).forEach((p,i)=>{if(!p)return;if(i%2)out.push({s:p,hl:true});else plain(p)})}else plain(s);return out}

   layer(1-s.v(3),()=>{txt('几十万年前：至少 6 种人同时存在',W/2,by+8,{size:n?11.5:13,w:700,f:'d'})});
   layer(s.v(3),()=>{const alive=sp.filter(q=>!q[5]||now>q[5]).length-(now<3e4?0:0);txt(`还剩 ${sp.filter(q=>!(q[5]&&now<=q[5])).length} 种`+(ex>=1?' → 直立人的记录也在更早结束，最后只剩智人':''),W/2,by+8,{size:n?11:13,w:700,f:'d',color:C.red})});
  });
  layer(s.v(4),()=>{
   const q=[['🧠','大脑：占体重 2%~3%','休息时却耗掉 25% 的能量（其他猿类约 8%）。代价是要花更多时间找食物，肌肉也退化了。'],['🔥','火：30 万年前已是家常便饭','直立人、尼安德特人和智人的祖先都会用火。火让食物易于消化，肠道缩短，大脑才得以变大。'],['❓','那为什么偏偏是智人？','答案在下一幕：一种新的语言能力。']];
   const cw=n?(W-24):Math.min(260,(W-80)/3),gap=n?6:14,tot=n?cw:cw*3+gap*2;let x=(W-tot)/2;
   q.forEach((it,i)=>{const yy=n?by-6+i*((H-by-4)/3):by,hh=n?(H-by-4)/3-gap:H-by-(n?8:16);
    const bx=n?x:x+i*(cw+gap);box(bx,yy,cw,hh,{fill:i===2?rgba(C.acc,.12):C.sheet,stroke:i===2?C.acc:C.line,r:8});
    if(n){emo(it[0],bx+18,yy+hh/2,16);txt(it[1],bx+36,yy+hh/2,{size:11.5,w:700,align:'left'})}
    else{emo(it[0],bx+22,yy+22,18);txt(it[1],bx+42,yy+22,{size:12,w:700,align:'left'});para(it[2],bx+14,yy+46,cw-28,{size:11,align:'left',color:C.muted})}
    hotR(bx,yy,cw,hh,it[1],it[2])});
  });
 });
}},

{nav:'虚构故事',chap:'第 2 章 · 知善恶树',title:'会讲故事的猿',
ctrlSteps:[2,3],ctrl:`<label for="nsl">群体人数 <output id="nslo">8</output></label><input id="nsl" type="range" min="2" max="400" step="1" value="8"><div class="segbtns"><button id="storyb" aria-pressed="false">讲一个共同的故事</button></div><div class="note">拖动滑块：每多一个人，需要维持的一对一关系就多出一大截。超过约 150 人，只靠八卦的群体会分裂；按下按钮，看共同的故事怎样把陌生人重新连起来。</div>`,
enter(){rangeCtl('nsl',()=>n150,v=>{n150=v},v=>v);const b=document.getElementById('storyb');b.setAttribute('aria-pressed',storyOn);btnCtl('storyb',el=>{storyOn=!storyOn;el.setAttribute('aria-pressed',storyOn);el.textContent=storyOn?'收起故事，只靠八卦':'讲一个共同的故事'});b.textContent=storyOn?'收起故事，只靠八卦':'讲一个共同的故事'},
steps:[
 {h:'动物也有语言',dur:8,c:'7 万到 3 万年前，智人出现了新的思维和沟通方式，书中称为<b>认知革命</b>。但语言不是智人发明的：<b>青猴</b>有一种叫声表示“小心！有老鹰！”，稍作调整就成了“小心！有狮子！”。前者让猴群抬头望天，后者让它们冲上树。',q:'智人的语言并不是世界上的第一种语言。（第二章）'},
 {h:'智人语言的三种用途',dur:12,c:'书中依次比较三种解释。①<b>“河边有只狮子”</b>：智人能描述“今天上午在河湾，一群狮子正在跟踪野牛”，于是能一起规划狩猎。②<b>八卦</b>：知道部落里谁可靠、谁是骗子，能维持更大的群体。③<b>虚构故事</b>：谈论根本不存在的事物，这才是智人独有的。',q:'“讨论虚构的事物”正是智人语言最独特的功能。（第二章）'},
 {bg:1,h:'背景：黑猩猩、八卦与 150 人',dur:16,c:'黑猩猩靠<b>互相理毛</b>、一起打架来建立信任，族群一般只有 <b>20~50 只</b>；成员一多，秩序就动摇，族群分裂。智人用语言八卦，效率高得多，但人脑能记住的社会关系仍然有限。社会学研究认为，靠八卦维持的最大“自然”团体约 <b>150 人</b>。',terms:[['八卦','在背后谈论别人：谁和谁好、谁诚实、谁是骗子。书中认为这是语言最早的重要用途之一。'],['一对一关系','群体里任意两人之间的一条关系。n 个人就有 n(n−1)/2 条，50 人的部落有 1225 条。'],['150 人门槛','30 人的排、100 人的连，几乎不需要正式纪律；一个万人的师，就不能再用带排的方式领导。家族企业变大时也会碰上这道坎。']],ask:'拖动人数时注意两件事：关系数增长得有多快？超过 150 人以后，是什么让群体重新连起来？'},
 {h:'八卦的天花板',dur:11,c:'每个点是一个人，每条线是一段需要维持的关系。人数翻倍，关系数大约翻四倍：<b>50 人有 1225 对，150 人有 11175 对</b>。超过约 150 人，大多数人就无法真正了解所有成员，群体会分裂成几个小团伙。'},
 {h:'共同的故事跨过门槛',dur:12,c:'怎么建成有数万居民的城市、上亿人口的帝国？<b>只要同样相信某个故事，素不相识的人也能合作。</b>两个天主教徒从未谋面，也能一起参加十字军；两个律师素不相识，也能联手为陌生人辩护。人与人之间不再需要每一条线，只需要都连到同一个故事。',q:'人类和黑猩猩之间真正不同的地方就在于那些虚构的故事，它像胶水一样把千千万万的个人、家庭和群体结合在一起。（第二章）'},
 {h:'一起想象',dur:10,c:'虚构的重点不只是想象，而是<b>“一起”想象</b>。国家、金钱、人权、法律都只存在于人类共同的想象里，却真实地组织着几百万人的行为。故事也能迅速改写：1789 年，法国人几乎一夜之间从相信“天赋君权”改为相信“人民做主”。基因演化的路总在堵车，智人从此开上了<b>文化演化</b>的快速道路。',q:'除了存在于人类共同的想象之外，这个宇宙中根本没有神、没有国家、没有钱、没有人权、没有法律，也没有正义。（第二章）'}
],
draw(s){
 const {W,H,t}=s,n=s.narrow,m=Math.min(W,H);
 const v1=s.v(1),v2=s.v(2),v3=s.v(3),v4=s.v(4);
 // ---- step 0: green monkey ----
 layer(1-v1,()=>{
  const ph=Math.floor((s.t*.25)%2),cx=W/2,gy=H*.72;
  seg(0,gy,W,gy,C.line,1.5);
  // tree
  const tx=W*.78;box(tx-8,gy-H*.32,16,H*.32,{fill:rgba(C.amber,.6),r:3});dot(tx,gy-H*.36,m*.1,rgba(C.teal,.5));
  // monkeys
  for(let i=0;i<5;i++){const bx=W*.18+i*W*.09;let x=bx,y=gy-10;const p=(s.t*.25%1);
   if(ph===1){const q=E.io(clamp(p*2-.2*i/5));x=lerp(bx,tx-20+i*8,q);y=lerp(gy-10,gy-H*.3+i*10,q)}
   emo('🐒',x,y,n?20:26);if(ph===0&&i===2)emo('🐒',x,y,n?20:26)}
  const call=ph===0?'“小心！有老鹰！”':'“小心！有狮子！”';
  bubble(call,W*.3,H*.28,220,{size:n?12:14,tail:-10});
  txt(ph===0?'→ 猴群停下动作，望向天空':'→ 猴群立刻冲到树上',W*.3,H*.28+(n?34:40),{size:n?11:12,color:C.muted});
  if(ph===0)emo('🦅',W*.62,H*.16+Math.sin(t*2)*6,n?24:30);else emo('🦁',W*.08+((s.t*.25%1))*W*.2,gy-14,n?24:30);
  hotC(W*.3,H*.28,60,'青猴的叫声','动物学家确定：青猴的某种叫声代表“小心！有老鹰！”，稍微调整就变成“小心！有狮子！”。这是有声语言，但只传达眼前的真实信息。');
 });
 // ---- step 1: three functions ----
 layer(v1*(1-v2),()=>{
  const it=[['🦁','河边有只狮子','“今天上午，在附近的河湾，有一群狮子正在跟踪一群野牛。”','能传达大量关于环境的信息','规划并执行复杂的计划，像是躲开狮子、猎捕野牛',C.amber],
   ['🗣️','八卦','“部落里谁讨厌谁、谁跟谁在交往、谁诚实、谁是骗子。”','能传达大量关于社会关系的信息','组织更大、更有凝聚力的群体，规模可达 150 人',C.blue],
   ['🦁✨','虚构故事','“狮子是我们部落的守护神。”','能传达关于不存在的事物的信息','大批陌生人之间的合作，社会行为快速创新',C.red]];
  const k=clamp(Math.floor(s.age/3.2),0,2);
  const cw=n?W-24:(W-80)/3,gap=n?8:16;
  it.forEach((q,i)=>{const on=s.step>1||REDUCED||i<=k;
   layer(on?1:.25,()=>{let x,y,h;if(n){x=12;h=(H-40)/3-gap;y=20+i*(h+gap)}else{x=40+i*(cw+gap);y=H*.12;h=H*.76}
    box(x,y,cw,h,{fill:i===2?rgba(C.red,.08):C.sheet,stroke:q[5],r:10,lw:i===2?2:1.2});
    if(n){emo(q[0],x+24,y+h/2,22);txt(q[1],x+52,y+20,{size:13,w:900,f:'d',color:q[5],align:'left'});para(q[2],x+52,y+42,cw-62,{size:10.5,align:'left'});txt('→ '+q[4],x+52,y+h-14,{size:10,color:C.muted,align:'left'})}
    else{emo(q[0],x+cw/2,y+44,34);txt(q[1],x+cw/2,y+92,{size:17,w:900,f:'d',color:q[5]});
     const hh=para(q[2],x+cw/2,y+128,cw-36,{size:12.5,w:600});
     txt('新能力',x+cw/2,y+150+hh,{size:10,f:'m',color:C.muted});para(q[3],x+cw/2,y+170+hh,cw-36,{size:11.5});
     txt('更深远的影响',x+cw/2,y+214+hh,{size:10,f:'m',color:C.muted});para(q[4],x+cw/2,y+234+hh,cw-36,{size:11.5,w:700,color:q[5]})}
    hotR(x,y,cw,h,q[1],q[3]+'。影响：'+q[4]+'。（第二章表格“认知革命有什么影响”）')})});
 });
 // ---- steps 3-5: network ----
 layer(v2,()=>{
  let N=n150;if(s.step===2){const a=autoVal('nsl',Math.round(lerp(8,180,clamp((s.age-.6)/8))),v=>v);if(a!=null)N=n150=a}
  if(s.step===3&&!TOUCH.storyb&&s.age>2.5&&!storyOn){storyOn=true;const b=document.getElementById('storyb');if(b){b.setAttribute('aria-pressed','true');b.textContent='收起故事，只靠八卦'}}
  if(s.step>=3&&!TOUCH.nsl&&N<300){const a=autoVal('nsl',Math.min(400,Math.max(N,320)),v=>v);if(a!=null)N=n150=a}
  if(s.step<3&&!TOUCH.storyb)storyOn=false;
  const pairs=N*(N-1)/2,over=N>150;
  const top=n?70:64,cy=top+(H-top-(n?60:50))/2,R=Math.min(W*(n?.44:.3),(H-top-(n?60:50))/2-6);
  const cx=n?W/2:W*.4;
  // groups when over limit and no story
  const st=storyOn?1:0;
  const ng=over&&!st?Math.ceil(N/120):1;
  const pts=[];for(let i=0;i<N;i++){const g=i%ng;const ga=g/ng*TAU-Math.PI/2;const gcx=cx+(ng>1?Math.cos(ga)*R*.55:0),gcy=cy+(ng>1?Math.sin(ga)*R*.55:0);
   const rr0=(ng>1?R*.4:R)*Math.sqrt(rnd(i*3+1)),aa=rnd(i*7+2)*TAU;pts.push([gcx+Math.cos(aa)*rr0,gcy+Math.sin(aa)*rr0,g])}
  // links: sample at most ~1500
  const maxL=1600;const all=pairs;const stepL=Math.max(1,Math.ceil(all/maxL));
  ctx.lineWidth=.6;
  if(!st){let c=0;ctx.strokeStyle=rgba(over?C.red:C.blue,Math.max(.05,Math.min(.5,30/Math.sqrt(all+1))));ctx.beginPath();
   for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){if((c++%stepL))continue;if(pts[i][2]!==pts[j][2])continue;ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[j][0],pts[j][1])}ctx.stroke()}
  else{ctx.strokeStyle=rgba(C.amber,.25);ctx.beginPath();pts.forEach(p=>{ctx.moveTo(p[0],p[1]);ctx.lineTo(cx,cy)});ctx.stroke()}
  pts.forEach(p=>dot(p[0],p[1],N>200?1.6:N>60?2.2:3.2,st?C.amber:over?C.red:C.blue));
  if(ng>1&&!st){for(let g=0;g<ng;g++){const ga=g/ng*TAU-Math.PI/2;const gx=cx+Math.cos(ga)*R*.55,gy=cy+Math.sin(ga)*R*.55;ctx.beginPath();ctx.arc(gx,gy,R*.44,0,TAU);ctx.strokeStyle=rgba(C.red,.5);ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([])}}
  if(st){glow(cx,cy,R*.5,C.amber,.35);emo('🦁',cx,cy-4,n?26:34);txt('守护灵 · 共同的故事',cx,cy+(n?22:28),{size:n?10.5:12,w:700,color:C.amber});
   hotC(cx,cy,30,'共同的故事','部落守护灵、神、国家、公司……只要大家同样相信，就不需要人人互相认识。每个人只需和故事相连，连线数随人数线性增长。')}
  hotC(cx,cy,R,'群体',`现在有 ${N} 人。只靠八卦，需要维持 ${pairs.toLocaleString()} 条一对一关系。`);
  // readout
  const rx=n?W/2:W*.8,ry=n?top-30:H*.3;
  const lines=[[`${N}`,'人'],[pairs.toLocaleString(),'条一对一关系'],[st?N.toLocaleString():'—','条“人-故事”连线']];
  if(n){txt(`${N} 人 · ${pairs.toLocaleString()} 对关系`+(st?` · 故事连线 ${N}`:''),rx,ry,{size:12.5,w:700,f:'m',color:over&&!st?C.red:C.ink});
   txt(over?(st?'共同的故事让陌生人合作':'超过 150 人：群体分裂'):'150 人以内：靠八卦就能运作',rx,ry+20,{size:11,w:700,color:over&&!st?C.red:st?C.amber:C.blue})}
  else{lines.forEach((L,i)=>{const c=i===1?(over&&!st?C.red:C.blue):i===2?C.amber:C.ink;txt(L[0],rx,ry+i*68,{size:30,w:700,f:'m',color:i===2&&!st?C.line:c});txt(L[1],rx,ry+i*68+26,{size:11.5,color:C.muted})});
   const msg=over?(st?'共同的故事让陌生人合作':'超过 150 人：只靠八卦，群体分裂'):'150 人以内：靠八卦就能运作';
   pill(msg,rx,ry+3*68+4,{size:11.5,bg:over&&!st?C.red:st?C.amber:C.blue})}
  // 150 gauge
  const gx0=n?24:40,gx1=n?W-24:W*.66,gy=H-(n?24:26);seg(gx0,gy,gx1,gy,C.line,4);
  const X=v=>gx0+(gx1-gx0)*clamp(v/400);
  [[20,'黑猩猩 20'],[50,'50'],[150,'150']].forEach(([v,l])=>{seg(X(v),gy-6,X(v),gy+6,v===150?C.red:C.muted,1.5);txt(l,X(v),gy-14,{size:9.5,f:'m',color:v===150?C.red:C.muted})});
  dot(X(N),gy,6,over&&!st?C.red:st?C.amber:C.blue);
  box(X(20),gy-2,X(50)-X(20),4,{fill:rgba(C.teal,.6),r:2});
  hotR(X(20),gy-8,X(50)-X(20),16,'黑猩猩族群：20~50 只','靠理毛和一起打架建立信任。成员一多，秩序动摇，族群就分裂。');
  hotR(X(150)-6,gy-20,12,30,'150 人门槛','借由八卦来维持的最大“自然”团体大约是 150 人。（第二章）');
  // step5 overlay: imagined things
  layer(v4,()=>{const items=['神','国家','金钱','人权','法律','公司'];const R2=R*1.02;
   items.forEach((w0,i)=>{const a=i/items.length*TAU+t*.12;const x=cx+Math.cos(a)*R2,y=cy+Math.sin(a)*R2;pill(w0,x,y,{size:n?10.5:12,bg:C.sheet,color:C.amber,stroke:C.amber});
    hotC(x,y,18,w0,'只存在于人类共同的想象中，却真实地组织着陌生人的合作。')})});
 });
}},

{nav:'标致公司',chap:'第 2 章 · 知善恶树',title:'标致公司真的存在吗？',
ctrlSteps:[0],ctrl:`<div class="lbl">把这些东西一样样拿走</div><div class="segbtns" id="peub"><button data-k="car">回收所有汽车</button><button data-k="fac">毁掉所有工厂</button><button data-k="emp">全体员工离开</button><button data-k="sh">股东卖光股票</button><button data-k="judge">法官下令解散</button></div><div class="note">每按一个按钮，就拿走一样“看得见的东西”。观察中间的公司标记什么时候才会消失。</div>`,
enter(){const bs=[...document.querySelectorAll('#peub button')];const sync=()=>bs.forEach(b=>b.setAttribute('aria-pressed',peu[b.dataset.k]?'true':'false'));bs.forEach(b=>b.onclick=()=>{TOUCH.peu=true;const k=b.dataset.k;peu[k]=peu[k]?0:NOW;sync()});this._sync=sync;sync()},
steps:[
 {bg:1,h:'背景：从狮人到标致',dur:16,c:'德国施泰德洞穴出土过一尊象牙“<b>狮人</b>”雕像，人身狮头，约 3.2 万年前，是最早能确定的艺术品之一，也可能是最早的宗教证据。300 公里外的法国瓦朗蒂盖伊村，是<b>标致汽车</b>（Peugeot）的起源地，它的商标恰好也是一头狮子。标致全球有 <b>20 万</b>名员工，大多互不相识；2008 年，他们合作造出了 150 多万辆车，营收约 550 亿欧元。',terms:[['有限公司','法律上独立于创办人、投资者和管理者的“个体”。公司负债，股东和创办人不必用自己的房子去还。'],['法律拟制 legal fiction','法律“当作它存在”的东西。公司就是最典型的一种。'],['法人','法律上把公司当成人：能开银行账户、拥有财产、纳税、被起诉。corporation 一词来自拉丁文 corpus（身体），而公司恰恰没有身体。'],['尚恩','书中设想的 13 世纪法国马车匠。他就是他的工作室，店倒了要卖房卖牛还债，甚至可能被卖为奴隶。']],ask:'书中问：“该以什么标准，我们才能说标致公司确实存在？”下一步，试着把公司的东西一样样拿走。'},
 {h:'做减法',dur:16,c:'把所有标致汽车回收打成废铁，公司还能造新车；员工全部罹难、工厂全毁，公司还能借钱、重新雇人；股东卖光股票，公司依然存在。但只要<b>一位法官下令解散</b>，车、厂、人都还在，公司却当场消失。用右侧按钮自己试试。',q:'标致公司只是我们的一个集体想象，这种想象在法律上称为“法律拟制”（legal fiction）。（第二章）'},

{nav:'农业骗局',chap:'第 5 章 · 史上最大骗局',title:'是小麦驯化了人',

steps:[
 {bg:1,h:'背景：杰里科绿洲',dur:16,c:'约 1.8 万年前，最后一个冰河时代结束，中东的气温上升、雨量增多，很适合小麦生长。采集者把野生麦子带回营地加工，种子沿路掉落；他们放火烧灌木丛，又给小麦清出了阳光。巴勒斯坦的<b>杰里科</b>（Jericho）绿洲是书中的例子：公元前 13000 年，这里能养活约 <b>100 名</b>健康的采集者；到公元前 8500 年，成了约 <b>1000 人</b>的农村。',terms:[['驯化 domesticate','来自拉丁文 domus，意思是“房子”。书中反问：现在关在房子里的，究竟是小麦还是智人？'],['演化上的成功','衡量标准是世界上这个物种 DNA 拷贝数的多少，而不是个体是否快乐。'],['纳图芬文化','公元前 12500 至前 9500 年黎凡特的采集者文化。他们已定居村落、研磨野生谷物，后代逐渐变成农民。']],ask:'接下来切换“人的视角”和“小麦的视角”。同一场革命，谁是赢家？'},
 {h:'两种视角',dur:14,c:'<b>小麦的视角</b>：1 万年前它只是中东一小片地区的野草，如今占地约 225 万平方公里，快有英国的 10 倍大，是地球史上最成功的植物。<b>人的视角</b>：要清石头、除草、驱虫、挑水，脊椎和膝盖付出代价，出现椎间盘突出、关节炎和疝气，还得永久住在麦田旁边。用右侧按钮切换。',q:'人类以为自己驯化了植物，但其实是植物驯化了智人。（第五章）'},
 {h:'人更多了，日子更苦了',dur:11,c:'种小麦让每单位土地产出更多食物，人口呈指数增长；但农民的饮食更单一，工作更久，更容易遭遇旱灾、疾病和盗贼。大多数早期农业社会里，至少 1/3 的儿童活不到 20 岁。<b>物种赢了，个体输了。</b>',q:'这正是农业革命真正的本质：让更多的人却以更糟的状况活下去。（第五章）'},
 {h:'奢侈生活的陷阱',dur:16,c:'没有人“决定”务农。每一步都只想让生活轻松一点，每一步也都合理。等到问题浮现，已经没有人记得别的活法；而且人口一涨就回不了头：<b>村子从 100 人涨到 110 人，难道会有 10 个人自愿挨饿？</b>现代版本是电子邮件，以及发誓 35 岁退休、结果背上房贷的大学毕业生。用右侧按钮一步步往前走，再试着回头。',q:'奢侈品史上常有这样的情况，就是原本的奢侈品往往最后会成为必需品，而且带来新的义务。（第五章）'},
 {h:'最重要的一课',dur:10,c:'农业革命也是家畜的灾难。今天全球有超过 250 亿只鸡、约 10 亿头猪、超过 10 亿头牛，按 DNA 拷贝数算，它们极其成功；但肉鸡出生几周就被屠宰，现代酪农场里的奶牛通常只能活到 5 岁。这些动物的个体，是史上最悲惨的一群生物。',q:'我们从农业革命能学到的最重要一课，很可能就是物种演化上的成功并不代表个体的幸福。（第五章）'}
],
draw(s){
 const {W,H,t}=s,n=s.narrow,m=Math.min(W,H);
 const v1=s.v(1),v2=s.v(2),v3=s.v(3);NOW=s.t;
 const note=document.getElementById('trapNote'),tb=document.getElementById('trapb'),wb=document.getElementById('wvb');
 if(tb){tb.hidden=s.step!==2;wb.hidden=s.step!==0}
 // ---- step 1: two views ----
 if(s.step===0&&!TOUCH.wv){const k=Math.floor(s.age/5)%2?'w':'h';if(k!==wheatView){wheatView=k;segCtl('#wvb',()=>wheatView,k2=>{TOUCH.wv=true;wheatView=k2})}}
 layer(1-v1,()=>{

   for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(x+sw*1.6-2+(k%2)*4,gy-56+k*6,2.4,4.4,(k%2?.5:-.5),0,TAU);ctx.fillStyle=C.amber;ctx.fill()}}
  if(isW){
   txt('小麦的视角',W/2,H*.12,{size:n?16:22,w:900,f:'d',color:C.amber});
   const rows=[['1 万年前','中东一小片地区的野草'],['1000 年内','传遍世界各地'],['今天','约 225 万平方公里，快有英国的 10 倍']];
   rows.forEach((r,i)=>{const y=H*.24+i*(n?32:38);txt(r[0],W/2-8,y,{size:n?11:13,w:700,f:'m',color:C.muted,align:'right'});txt(r[1],W/2+8,y,{size:n?11.5:14,w:700,align:'left'})});
   txt('“我让一种猿替我清石头、除草、挑水、施肥、站岗。”',W/2,gy+(n?34:40),{size:n?11:13.5,w:600,f:'d',color:C.amber});
   hotR(W*.08,gy-70,W*.84,70,'小麦','以生存和繁衍为标准，小麦是地球史上最成功的植物。北美大平原 1 万年前没有一株小麦，如今几百公里内只有麦田。');
  }else{
   txt('人的视角',W/2,H*.12,{size:n?16:22,w:900,f:'d',color:C.red});
   const jobs=['清石头','除草','驱虫','守卫','挑水','施肥'];
   jobs.forEach((j,i)=>{const x=W/2+(i-(jobs.length-1)/2)*(n?56:96),y=H*.26;pill(j,x,y,{size:n?10.5:12,bg:C.sheet,color:C.ink,stroke:C.line})});
   // bent farmer
   const fx=W*.5,fy=gy-24;const b=Math.sin(t*2)*.08+.5;
   ctx.save();ctx.translate(fx,fy);ctx.rotate(b);person(0,0,n?9:12,C.red);ctx.restore();
   const ail=['椎间盘突出','关节炎','疝气'];ail.forEach((a,i)=>pill(a,W/2+(i-1)*(n?86:120),H*.4,{size:n?10.5:11.5,bg:C.red}));
   txt('“驯化”来自 domus（房子）：被关进房子里的是智人',W/2,gy+(n?34:40),{size:n?11:13.5,w:600,f:'d',color:C.red});
   hotC(fx,fy,30,'农民','研究古代骨骼发现，进入农业时代后，人类出现大量椎间盘突出、关节炎和疝气。我们适应的是爬果树、追瞪羚，而不是弯腰清石块、挑水桶。');
  }
 });
 // ---- step 2: two curves ----
 layer(v1*(1-v2),()=>{
  const x0=n?40:80,x1=W-(n?20:60),y0=H*.16,y1=H*.78;
  seg(x0,y1,x1,y1,C.ink,1.4);seg(x0,y0,x0,y1,C.ink,1.4);
  txt('公元前 13000',x0,y1+16,{size:10,f:'m',color:C.muted,align:'left'});txt('公元前 8500',x1,y1+16,{size:10,f:'m',color:C.muted,align:'right'});
  const p=REDUCED?1:clamp(s.age/5);const N=60;
  const pop=[],q=[];for(let i=0;i<=N*p;i++){const u=i/N;pop.push([lerp(x0,x1,u),lerp(y1-10,y0,Math.pow(u,1.8))]);q.push([lerp(x0,x1,u),lerp(y0+40,y1-50,u*.8+Math.sin(u*9)*.03)])}
  if(pop.length>1){polyline(pop,C.teal,3);polyline(q,C.red,3)}
  const lp=pop[pop.length-1],lq=q[q.length-1];
  if(lp){txt('人口：约 100 → 约 1000',lp[0]-6,lp[1]-14,{size:n?11:13,w:700,color:C.teal,align:'right'});txt('个人的生活品质',lq[0]-6,lq[1]+18,{size:n?11:13,w:700,color:C.red,align:'right'})}
  txt('杰里科绿洲',x0+10,y0-6,{size:n?11:12.5,w:700,f:'d',align:'left'});
  hotR(x0,y0,x1-x0,y1-y0,'杰里科','公元前 13000 年约百名健康的采集者；公元前 8500 年约千人的农村，染病和营养不良的情形严重得多。（示意曲线）');
 });
 // ---- step 3: ratchet ----
 layer(v2*(1-v3),()=>{
  if(s.step===2&&!TOUCH.trap){weeks=Math.min(TRAP.length,Math.floor(s.age/2.2));const bk0=document.getElementById('trapBack');if(bk0&&s.age>14.2&&!bk0.dataset.auto){bk0.dataset.auto=1;bk0.dataset.no=s.t}}
  const k=weeks;const pop=Math.round(100*Math.pow(1.1,k));

   layer(on?1:.28,()=>{box(x0,y,w,rowH-6,{fill:on?rgba(C.amber,.12):C.sheet,stroke:on?C.amber:C.line,r:7});
    txt((i+1)+'. '+r[0],x0+12,y+(rowH-6)/2-(n?0:7),{size:n?11:13,w:700,align:'left'});if(!n)txt(r[1],x0+12,y+(rowH-6)/2+11,{size:10.5,color:C.muted,align:'left'});
    if(on)txt('✓ 合理',x0+w-12,y+(rowH-6)/2,{size:n?10:11.5,w:700,color:C.teal,align:'right'})});
   hotR(x0,y,w,rowH-6,r[0],r[1])});
  const by=top+TRAP.length*rowH+(n?12:16);
  txt(`村落人口：${pop} 人`,W/2,by+8,{size:n?14:18,w:700,f:'m',color:C.ink});
  const bw=Math.min(w,460),bx=(W-bw)/2;box(bx,by+24,bw,10,{fill:C.soft,r:5});box(bx,by+24,bw*clamp(pop/180),10,{fill:C.teal,r:5});
  const bk=document.getElementById('trapBack');const no=bk&&bk.dataset.no&&NOW-(+bk.dataset.no)<3.5;
  const back=k<3?'还能回头':'回不去了：多出的人怎么办？';
  txt(back,W/2,by+(n?54:58),{size:n?12:14,w:700,f:'d',color:k<3?C.teal:C.red});
  if(no){bubble(`${pop} 人里，谁愿意自愿挨饿，好让其他人回到采集生活？`,W/2,by-30,Math.min(W-30,380),{size:n?11.5:13,bg:C.red,stroke:C.red,color:C.sheet})}
  if(note)note.textContent=k<3?'前几步还能退回去。':'人口已经涨上来，按“回到采集生活”试试会发生什么。';
  if(bk){bk.disabled=false;bk.style.opacity=k<3?1:.55}
 });
 // ---- step 4: livestock ----
 layer(v3,()=>{
  const it=[['🐔','鸡','超过 250 亿只','家鸡是有史以来最普遍的鸟类。驯化后的肉鸡出生几周就到了最佳屠宰年龄。'],['🐖','猪','约 10 亿头','1 万年前，绵羊、牛、山羊、野猪和鸡总数只有几百万只。'],['🐄','牛','超过 10 亿头','野生的牛能活 20~25 年。奶牛能多活几年，却过着完全不符合天性和渴望的生活。'],['🐑','绵羊','约 10 亿只','']];

{nav:'想象的秩序',chap:'第 6–8 章 · 盖起金字塔 / 记忆过载 / 历史从无正义',title:'两份 1776 年的合作手册',
ctrlSteps:[0],ctrl:`<div class="segbtns"><button id="bioB" aria-pressed="false">用生物学的语言重写</button></div><div class="note">按下按钮，把《独立宣言》最著名的一句逐词改写成生物学说法；再按一次恢复原文。</div>`,

steps:[
 {bg:1,h:'背景：巴比伦与费城',dur:16,c:'农业产生了剩余粮食，也养活了国王、官员、祭司和士兵。几十万人要合作，靠的是什么？书中拿两份文件对照。<b>公元前 1776 年</b>，巴比伦是当时最大的城市，帝国子民超过百万；国王汉谟拉比颁布法典，说是安努、恩利尔、马杜克三位大神授权他“在这片土地伸张正义”。<b>3500 年后的 1776 年</b>，北美 13 个英国殖民地的代表聚在费城，宣布脱离英国王室。',terms:[['《汉谟拉比法典》','约 300 条判例，固定写法是“如果情形如何如何，判决便应如何如何”。书中称它是几十万古巴比伦人的合作手册。'],['上等人 / 平民 / 奴隶','法典把人分成男女两种性别和这三种阶级，价值天差地别。'],['舍客勒 shekel','银子的重量单位，约 8.33 克。'],['《独立宣言》','书中称它是现代数亿美国人的合作手册。']],ask:'两份文件都说自己讲的是“普遍且永恒的正义”，却互相矛盾。它们哪一份是对的？'},
 {h:'两块石板',dur:16,c:'汉谟拉比说人分等级，每一级的“价钱”不同；《独立宣言》说人人生而平等。书中的回答是：<b>两者都错了</b>，平等和阶级都没有客观的生物学基础。生物学里没有“创造”，只有演化；演化的基础是差异，不是平等。按右侧按钮，看宣言用生物学语言重写后的样子。',q:'我们相信某种秩序，并非因为它是客观的现实，而是因为相信它可以让人提升合作效率、打造更美好的社会。（第六章）'},
 {h:'客观、主观、主体间',dur:13,c:'想象的秩序为什么推不倒？因为它不在某一个人的脑子里，而是<b>存在于主体之间</b>（inter-subjective）。放射线是<b>客观</b>的，居里夫人不相信它有害，最后还是死于它造成的贫血；小孩想象的朋友是<b>主观</b>的，长大不信了，朋友就消失；法律、金钱、国家是<b>主体间</b>的，一个人不信没有用，要几百万人一起改变想法才行。',q:'每一次我们以为自己打破了监狱的高墙、迈向自由的前方，其实只是到了另一间更大的监狱，把活动范围稍稍加以扩大。（第六章）'},
 {h:'史上第一个名字属于会计师',dur:13,c:'帝国要收税，就得记住大量数字，而人脑并不擅长。公元前 3500 年到前 3000 年，苏美尔人发明了<b>文字</b>。目前找到最早的信息之一是乌鲁克泥板上的“<b>29086 单位大麦 37 个月 库辛</b>”，意思最可能是：“37 个月间共收到 29086 单位大麦，由库辛签核。”最早的文字只能<b>部分表意</b>，像数学符号一样只记账，写不了诗。',q:'这一切说明，史上第一个记下的名称或名字，是属于一个会计师，而不是什么先知、诗人，或是伟大的征服者。（第七章）'},
 {h:'想象的秩序带来阶级',dur:11,c:'每一种想象的秩序都会把人分成高低不同的群体：上等人和平民、种姓、黑人和白人、富人和穷人。这些分别大多始于偶然的历史事件，再被故事固定下来，变成恶性循环。区分“天生”与“文化”有一条简单的法则：生物学允许各种可能，<b>是文化在禁止</b>。',q:'一项黄金法则就是“天生带来允许，文化造成封闭”。（第八章）'}
],
draw(s){

{nav:'快乐与未来',chap:'第 19–20 章 · 从此过着幸福快乐的日子 / 智人末日 · 后记',title:'力量变大了，人更快乐了吗？',
ctrlSteps:[0],ctrl:`<label for="csl">客观条件 <output id="cslo">50</output></label><input id="csl" type="range" min="0" max="100" step="1" value="50"><label for="esl">主观期望 <output id="eslo">50</output></label><input id="esl" type="range" min="0" max="100" step="1" value="50"><div class="note">指针只看两者是否相符：条件变好，期望也跟着涨，快乐就回到原处。</div>`,
enter(){rangeCtl('csl',()=>cond,v=>{cond=v});rangeCtl('esl',()=>expect,v=>{expect=v})},
steps:[
 {bg:1,h:'背景：怎么测量快乐',dur:16,c:'历史书很少问：这些革命让人更快乐了吗？近几十年，心理学家和生物学家开始用问卷调查<b>主观幸福感</b>，再和财富、健康、婚姻等条件对照。几个发现：钱能带来快乐，但有上限。年收入一万多元的清洁工中了两百万元彩票，快乐能持续好一阵子；年薪几百万的高管中了两三千万，只会高兴几个星期。家庭和社群的影响比金钱和健康都大。',terms:[['主观幸福感','请受访者自己回答“你对现在的生活有多满意”，再做统计。'],['期望','你觉得自己“应该”得到什么。它随条件水涨船高。'],['血清素、多巴胺、催产素','让人感到愉快的几种生化物质。书中说快乐最终是大脑里的生化反应。']],ask:'接下来拖动两个滑块，看什么情况下快乐会真正提高。'},
 {h:'条件 vs 期望',dur:16,c:'想要牛车，得到牛车，你会满足；想要全新法拉利，得到二手菲亚特，你会不开心。所以中乐透或出车祸，对长期幸福感都没有太大影响。条件改善，期望也跟着膨胀；媒体和广告又不断告诉我们“应该”拥有什么。拖动两个滑块试试。',q:'快乐并不在于任何像是财富、健康甚至社群之类的客观条件，而在于客观条件和主观期望之间是否相符。（第十九章）'},
 {h:'快乐空调',dur:14,c:'生物学的解释更彻底：快乐由生化机制决定，就像一台<b>空调</b>，每个人有自己的设定温度。有人天生开朗，情绪在 6 到 10 分之间来回，稳定在 8 分附近；有人在 3 到 7 分之间，稳定在 5 分。一个古代中国农夫盖好土屋，一个香港企业家还完豪宅房贷，大脑分泌的血清素都只到 X。',q:'对大脑来说，它完全不知道豪宅要比土屋舒适太多，它只知道现在的血清素浓度是X。（第十九章）'},
 {h:'意义，与佛教的回答',dur:12,c:'卡尼曼发现，养小孩时换尿布、洗碗、处理哭闹，大多数时刻并不愉快，但父母都说孩子是快乐的主要来源。所以快乐不只是愉快的时刻多于痛苦，而是<b>觉得生命整体有意义</b>。佛教走得更远：快乐既不在外在条件，也不在内心感受，痛苦来自对感受的渴求；放下追求，才能解脱。'},
 {bg:1,h:'背景：荧光兔阿巴',dur:14,c:'2000 年，巴西生物艺术家<b>爱德华多·卡茨</b>付钱请法国一间实验室，改造出一只会发荧光绿的兔子：把绿色荧光水母的 DNA 植入普通兔子胚胎。卡茨给它取名<b>阿巴</b>（Alba）。在将近 40 亿年里，所有生命都遵循自然选择；现在，生命可以被<b>智能设计</b>。',terms:[['自然选择','40 亿年来塑造一切生命的法则：能生存、能繁衍的特征留下来。'],['智能设计','生命由某个“设计者”刻意塑造。书中说，讲到未来，这个说法可能反而是对的。'],['吉尔伽美什计划','书中借古代史诗英雄之名，指现代科学想战胜死亡的计划。']],ask:'最后一步，书中提出了三条可能取代自然选择的道路，以及一个问题。'},
 {h:'变成神的动物',dur:16,c:'智能设计取代自然选择有三条路：<b>生物工程</b>（1996 年背上植入牛软骨细胞、长出“耳朵”的老鼠）、<b>仿生工程</b>（2001 年失去双臂的水电工杰西·沙利文装上了生化手臂）、<b>无机生命</b>（会自行演化的计算机病毒）。7 万年前，智人还是非洲角落一种微不足道的动物；今天它几乎拥有神的力量，却仍然不知道自己想要什么。',q:'或许真正该问的问题不是“我们究竟想要变成什么”，而是“我们究竟希望自己想要什么”（第二十章）'}
],
draw(s){

  if(s.step===0&&!TOUCH.csl&&!TOUCH.esl){const a=s.age;const cc=Math.round(clamp(30+a*6,30,90));const ee=Math.round(a<4?30:clamp(30+(a-4)*7,30,90));const r1=autoVal('csl',cc),r2=autoVal('esl',ee);if(r1!=null)c=cond=r1;if(r2!=null)e=expect=r2}
  const d=c-e;const hap=clamp(50+d*1.2,0,100);
  const cx=W/2,cy=H*(n?.44:.52),R=Math.min(W*(n?.38:.26),H*.36);
  // gauge
  ctx.lineCap='round';
  const a0=Math.PI*.85,a1=Math.PI*2.15;
  ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.strokeStyle=C.soft;ctx.lineWidth=n?16:22;ctx.stroke();
  const g=ctx.createLinearGradient(cx-R,cy,cx+R,cy);g.addColorStop(0,C.blue);g.addColorStop(.5,C.amber);g.addColorStop(1,C.teal);
  ctx.beginPath();ctx.arc(cx,cy,R,a0,lerp(a0,a1,hap/100));ctx.strokeStyle=g;ctx.stroke();ctx.lineCap='butt';
  const na=lerp(a0,a1,hap/100);seg(cx,cy,cx+Math.cos(na)*R*.8,cy+Math.sin(na)*R*.8,C.ink,3);dot(cx,cy,7,C.ink);
  txt(hap>62?'满足':hap<38?'不开心':'平平',cx,cy+R*.42,{size:n?16:22,w:900,f:'d',color:hap>62?C.teal:hap<38?C.blue:C.amber});
  txt('快乐 ≈ 条件 − 期望',cx,cy+R*.42+(n?24:30),{size:n?11:13,f:'m',color:C.muted});
  hotC(cx,cy,R,'快乐指针',`客观条件 ${c}，主观期望 ${e}。两者相符或条件超出期望时，你会满足。`);
  // two side bars
  const bw=n?18:26,bh=R*1.5,by=cy-bh/2-(n?10:0);
  [[c,'条件',C.teal,n?24:cx-R-70,'🐂→🏎'],[e,'期望',C.violet,n?W-24-bw:cx+R+44,'🏎']].forEach(([v,l,col,x])=>{box(x,by,bw,bh,{fill:C.soft,r:5});box(x,by+bh*(1-v/100),bw,bh*v/100,{fill:col,r:5});txt(l,x+bw/2,by+bh+16,{size:n?11:12.5,w:700,color:col});txt(v,x+bw/2,by-12,{size:n?11:13,w:700,f:'m'});hotR(x,by,bw,bh,l,l==='条件'?'财富、健康、社群等客观条件。':'你觉得自己应该得到什么。')});
  const ex=[['想要牛车，得到牛车','满足',C.teal],['想要法拉利，得到二手菲亚特','不开心',C.blue]];
  ex.forEach((q,i)=>{const y=H-(n?40:46)+i*(n?18:22);txt(q[0]+' → '+q[1],W/2,y,{size:n?10.5:12,color:q[2],w:600})});
 });
 // ---- step 1: thermostat ----
 layer(v1*(1-v2),()=>{
  const x0=n?40:80,x1=W-(n?20:60),y0=H*.12,y1=H*.62;
  const Y=v=>lerp(y1,y0,(v-1)/9);
  for(let v=1;v<=10;v++){seg(x0,Y(v),x1,Y(v),rgba(C.line,v===5||v===8?1:.4),1);if(v%1===0)txt(v,x0-10,Y(v),{size:9.5,f:'m',color:C.muted,align:'right'})}
  const ev=[[.2,'中乐透',+2],[.45,'失业',-2],[.7,'结婚',+1.4]];
  const line=(base,lo,hi,col,lab)=>{const P=[];for(let i=0;i<=120;i++){const u=i/120;let v=base+Math.sin(u*24+base)*.35;ev.forEach(([p,_,d])=>{const k=u-p;if(k>0)v+=d*Math.exp(-k*22)});v=clamp(v,lo,hi);P.push([lerp(x0,x1,u),Y(v)])}polyline(P,col,2.4);txt(lab,x1+4,Y(base),{size:n?9.5:11,w:700,color:col,align:n?'right':'left'})};
  line(8,6,10,C.teal,n?'8':'设定 8 分');line(5,3,7,C.blue,n?'5':'设定 5 分');
  ev.forEach(([p,l])=>{const x=lerp(x0,x1,p);seg(x,y0,x,y1,C.muted,1,[3,3]);txt(l,x,y0-10,{size:n?10:11,w:700,color:C.muted})});
  hotR(x0,y0,x1-x0,y1-y0,'快乐空调系统','重大事件会让情绪暂时波动，但很快回到原本的设定点。（示意）');
  // farmer vs tycoon
  const by=H*.76;const it=[['🛖','古代中国农夫','盖好了小土屋，旁边是猪圈'],['🏙','现代香港企业家','还完豪宅的最后一笔房贷，窗外是南海']];
  it.forEach((q,i)=>{const x=W*(i?.72:.28);emo(q[0],x-(n?34:60),by,n?22:30);txt(q[1],x-(n?14:34),by-(n?8:10),{size:n?11:13,w:700,align:'left'});if(!n)txt(q[2],x-34,by+12,{size:10.5,color:C.muted,align:'left'});pill('血清素 = X',x,by+(n?28:38),{size:n?10.5:12,f:'m',bg:C.violet});hotR(x-80,by-24,160,72,q[1],q[2]+'。大脑不管土屋还是豪宅，只管血清素浓度。')});
 });
 // ---- step 2: meaning ----
 layer(v2*(1-v3),()=>{
  const cols=[['逐刻计算','换尿布 · 洗碗 · 哭闹 · 发脾气',C.blue,'不愉快'],['回顾一生','孩子是快乐的主要来源',C.teal,'有意义']];
  cols.forEach((q,i)=>{const x=n?W/2:W*(i?.7:.3),y=n?H*(.1+i*.28):H*.18,w=n?W-30:W*.34,h=n?H*.24:H*.4;box(x-w/2,y,w,h,{fill:rgba(q[2],.08),stroke:q[2],r:10});
   txt(q[0],x,y+(n?20:30),{size:n?13:16,w:900,f:'d',color:q[2]});para(q[1],x,y+(n?46:70),w-30,{size:n?11:13});pill(q[3],x,y+h-(n?20:28),{size:n?11:12.5,bg:q[2]});hotR(x-w/2,y,w,h,'卡尼曼的研究',i?'大多数家长都说孩子是他们快乐的主要来源。':'就单纯的数字来说，养小孩可说是非常不愉快的事。')});
  const y=n?H*.72:H*.72;
  box(W/2-Math.min(W*.44,330),y,Math.min(W*.88,660),n?H*.22:H*.18,{fill:C.sheet,stroke:C.line,r:10});
  txt('☸ 佛教',W/2,y+(n?20:26),{size:n?13:15,w:900,f:'d',color:C.amber});
  para('快乐既不在外在条件，也不在内心感受。痛苦来自对感受的渴求，放下追求才能解脱。',W/2,y+(n?42:52),Math.min(W*.8,600),{size:n?10.5:12.5});
 });
 // ---- step 3: three paths + final ----
 layer(v3,()=>{
  const top=n?34:H*.08;
  const paths=[['🧬','生物工程','biological engineering','1996 年：背上植入牛软骨细胞、长出“耳朵”的老鼠；2000 年：荧光兔阿巴。'],['🦾','仿生工程','cyborg engineering','2001 年失去双臂的水电工杰西·沙利文，装上了用意念控制的生化手臂。'],['💾','无机生命','inorganic life','计算机病毒：能独立于创造者、自行复制演化的程序原型。']];
  const cw=n?W-24:(W-80)/3,ch=n?H*.17:H*.36;
  paths.forEach((q,i)=>{const x=n?12:40+i*(cw+0),y=n?top+i*(ch+8):top;box(x+(n?0:6),y,cw-(n?0:12),ch,{fill:C.sheet,stroke:C.violet,r:10});
   if(n){emo(q[0],x+24,y+ch/2,22);txt(q[1],x+52,y+ch/2-8,{size:13,w:900,f:'d',color:C.violet,align:'left'});txt(q[2],x+52,y+ch/2+12,{size:9.5,f:'m',color:C.muted,align:'left'})}
   else{emo(q[0],x+cw/2,y+40,32);txt(q[1],x+cw/2,y+82,{size:16,w:900,f:'d',color:C.violet});txt(q[2],x+cw/2,y+102,{size:10,f:'m',color:C.muted});para(q[3],x+cw/2,y+128,cw-40,{size:11,color:C.ink})}
   hotR(x,y,cw,ch,q[1],q[3])});
  // timeline arrow: 70k years
  const ty=n?top+3*(ch+8)+16:top+ch+(H*.1);
  const x0=n?20:60,x1=W-(n?20:60);arrow(x0,ty,x1,ty,C.ink,2,10);
  const pts=[[0,'7 万年前','非洲角落微不足道的动物'],[.75,'农业 · 帝国 · 科学',''],[1,'今天','几乎拥有神的力量']];
  pts.forEach(([u,a,b])=>{const x=lerp(x0,x1-14,u);dot(x,ty,5,C.ink);txt(a,x,ty+(n&&u>0&&u<1?18:-14),{size:n?10:11.5,w:700,align:u===0?'left':u===1?'right':'center'});if(b&&!n)txt(b,x,ty+18,{size:10.5,color:C.muted,align:u===0?'left':u===1?'right':'center'})});
  const qy=n?Math.min(H-24,ty+64):H-(H-ty)/2+10;

  layer(qa,()=>{txt('“我们究竟希望自己想要什么？”',W/2,qy,{size:n?15:22,w:900,f:'d',color:C.acc});
   hotR(W/2-200,qy-20,400,40,'后记 · 变成神的这种动物','拥有神的能力，但是不负责任、贪得无厌，而且连想要什么都不知道。天下危险，恐怕莫此为甚。（后记）')});
 });
}},
];
/* ====================================================================
   ENGINE
   ==================================================================== */
const FLAT=[];SCENES.forEach((sc,si)=>{let a=0;sc.steps.forEach((st,k)=>{FLAT.push({si,k,st,ak:st.bg?Math.max(0,a-1):a});if(!st.bg)a++})});
const bgEl=$('#bgcard');
let cur=0,sceneIdx=-1,sf=-1,sceneT=0,sceneFade=0,stepClock=0,stepAge=0,playing=!REDUCED;
const nav=$('#nav'),track=$('#track');
SCENES.forEach((sc,i)=>{const b=document.createElement('button');b.textContent=sc.nav;b.onclick=()=>jumpScene(i);nav.appendChild(b)});
const segEls=SCENES.map((sc,i)=>{const d=document.createElement('div');d.className='seg';d.style.flex=`${sc.steps.length} 1 0`;d.title=sc.nav;d.innerHTML='<i></i>';track.appendChild(d);return d});
const firstOf=si=>FLAT.findIndex(f=>f.si===si);
function jumpScene(si){go(firstOf(si),true)}
function enterScene(si,k,fromStart){
 sceneIdx=si;sceneT=0;sceneFade=REDUCED?1:0;sf=fromStart?k-1:k;
 const sc=SCENES[si],ctrl=$('#ctrl');
 if(sc.ctrl){ctrl.innerHTML=sc.ctrl;ctrl.hidden=false}else{ctrl.innerHTML='';ctrl.hidden=true}
 sc.enter&&sc.enter();
 [...nav.children].forEach((b,i)=>b.setAttribute('aria-current',i===si?'true':'false'));
 try{history.replaceState(null,'','#s'+si)}catch(e){}
}
function go(i,fromStart){
 i=clamp(i,0,FLAT.length-1);const prev=FLAT[cur];const f=FLAT[i];
 const forward=i>cur;cur=i;stepClock=0;stepAge=0;
 if(f.si!==sceneIdx)enterScene(f.si,f.ak,fromStart||forward);
 panel();
}
function panel(){
 const f=FLAT[cur],sc=SCENES[f.si];
 $('#chap').textContent=sc.chap;$('#stitle').textContent=sc.title;
 $('#steps').innerHTML=sc.steps.map((_,k)=>`<i class="${k<=f.k?'on':''}"></i>`).join('')+`<span>${f.k+1} / ${sc.steps.length}</span>`;
 $('#caph').textContent=f.st.h;$('#cap').innerHTML=f.st.bg?'画面里是这个例子的业务背景和关键术语。读完后进入下一步，再看动画演示。':f.st.c;
 const q=$('#quote');if(f.st.q){q.innerHTML='<small>原书要点</small>'+f.st.q;q.hidden=false}else q.hidden=true;
 {const c=$('#ctrl');c.hidden=!!f.st.bg||!(sc.ctrl&&(!sc.ctrlSteps||sc.ctrlSteps.includes(f.ak)))}
 if(f.st.bg){bgEl.innerHTML=`<div class="bgin"><div class="bgtag">例子背景</div><h4>${f.st.h.replace(/^背景：/,'')}</h4><p>${f.st.c}</p><dl>${f.st.terms.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl><div class="bgask">${f.st.ask}</div><div class="bgnext">按 → 或“下一步”进入例子</div></div>`;bgEl.hidden=false;bgEl.scrollTop=0}else{bgEl.hidden=true}
 $('#count').textContent=String(cur+1).padStart(2,'0')+' / '+String(FLAT.length).padStart(2,'0');
}
function setPlay(p){playing=p;$('#play').setAttribute('aria-label',p?'暂停':'播放');$('#playIcon').innerHTML=p?'<path d="M4 2h3v12H4zM9 2h3v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>'}
$('#play').onclick=()=>{if(!playing&&cur===FLAT.length-1&&stepClock>=FLAT[cur].st.dur){go(0,true)}setPlay(!playing)};
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
track.addEventListener('click',e=>{const r=track.getBoundingClientRect();const fr=clamp((e.clientX-r.left)/r.width);
 // map through segment widths
 let acc=0;for(let i=0;i<segEls.length;i++){const sr=segEls[i].getBoundingClientRect();if(e.clientX<=sr.right+2.5||i===segEls.length-1){const loc=clamp((e.clientX-sr.left)/sr.width);const n=SCENES[i].steps.length;go(firstOf(i)+Math.min(n-1,Math.floor(loc*n)),true);return}}});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.target===track)return;
 if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}else if(e.key===' '){setPlay(!playing);e.preventDefault()}});

// tooltip
let mouse=null,hoverHot=null;
function showTip(){
 if(!mouse){tip.hidden=true;cv.style.cursor='default';return}
 const h=hit(mouse.x,mouse.y);hoverHot=h;
 if(!h){tip.hidden=true;cv.style.cursor='default';return}
 cv.style.cursor=h.click?'pointer':'help';
 if(tip.dataset.key!==h.t+h.b){tip.innerHTML=`<b>${h.t}</b>${h.b}`;tip.dataset.key=h.t+h.b}
 tip.hidden=false;
 const tw0=tip.offsetWidth,th0=tip.offsetHeight;let x=mouse.x+16,y=mouse.y+16;
 if(x+tw0>W-8)x=mouse.x-tw0-14;if(x<8)x=8;if(y+th0>H-8)y=mouse.y-th0-14;if(y<8)y=8;
 tip.style.left=x+'px';tip.style.top=y+'px';
}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top}});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){mouse=null}});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();mouse={x:e.clientX-r.left,y:e.clientY-r.top};const h=hit(mouse.x,mouse.y);if(h&&h.click){h.click();mouse=null}else if(!h&&e.pointerType!=='mouse'){mouse=null}});

let last=performance.now();
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;
 readColors();
 const st=FLAT[cur].st;
 stepAge+=dt;
 if(playing){stepClock+=dt;if(stepClock>=st.dur){if(cur<FLAT.length-1)go(cur+1);else{stepClock=st.dur;setPlay(false)}}}
 sceneT+=dt;sceneFade=Math.min(1,sceneFade+dt/.7);
 const target=FLAT[cur].ak,diff=target-sf;
 if(REDUCED)sf=target;else{const sp=Math.max(1/1.1,Math.abs(diff)*1.8)*dt;sf+=Math.sign(diff)*Math.min(Math.abs(diff),sp)}
 // render
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);HOT=[];
 const a=E.out(sceneFade);
 const S={W,H,t:sceneT,dt,sf,age:stepAge,step:target,narrow:W<560,raw:k=>clamp(sf-k+1),v:k=>E.io(clamp(sf-k+1))};
 ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*16);
 try{SCENES[sceneIdx].draw(S)}catch(err){console.error(err)}
 ctx.restore();
 showTip();
 // progress
 const gp=cur+clamp(stepClock/st.dur);
 segEls.forEach((el,i)=>{const s0=firstOf(i),n=SCENES[i].steps.length;const f=clamp((gp-s0)/n);el.firstChild.style.width=(f*100)+'%';el.classList.toggle('past',gp>=s0+n)});
 track.setAttribute('aria-valuenow',cur+1);track.setAttribute('aria-valuemax',FLAT.length);
 requestAnimationFrame(frame);
}
readColors();
const hs=/^#s(\d)$/.exec(location.hash);
go(hs?firstOf(clamp(+hs[1],0,SCENES.length-1)):0,true);
setPlay(playing);
requestAnimationFrame(frame);
})();
